<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>植物美容学校 講習予約システム｜管理ページ</title>
<style>
  :root{
    --ink:#544739; --sage:#859A93; --cream:#FFFCF7; --bg:#F5F2EC;
    --muted:#8a8275; --line:#E5DFD3; --gold:#C9A86A;
    --paid:#5C7F6B; --unpaid:#B07A2E; --cancel:#A85B52; --free:#6E7E96;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.6;font-size:15px;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px;}
  a{color:var(--ink);}

  /* ヘッダー */
  header{background:var(--ink);color:var(--cream);padding:16px 0;margin-bottom:20px;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding-bottom:0;}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.04em;}
  header .sub{font-size:11px;color:#cdd6cf;letter-spacing:.1em;}
  .logout-btn{background:transparent;border:1px solid #6f6256;color:#e8e2d6;
    padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;}
  .logout-btn:hover{background:#6f6256;}

  /* ログイン */
  .login-card{max-width:380px;margin:60px auto;background:var(--cream);
    border:1px solid var(--line);border-radius:14px;padding:32px 28px;text-align:center;}
  .login-card h2{font-size:18px;margin:0 0 6px;}
  .login-card p{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;margin-bottom:14px;}
  .err{color:var(--cancel);font-size:13px;min-height:18px;margin-bottom:8px;}

  /* タブ */
  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tab{flex:1;padding:12px;text-align:center;background:var(--cream);
    border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);}
  .tab.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}

  /* ボタン */
  .btn{border:none;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--ink);color:var(--cream);}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .btn-paid{background:var(--paid);color:#fff;}
  .btn-cancel{background:transparent;border:1px solid var(--cancel);color:var(--cancel);}
  .btn-undo{background:transparent;border:1px solid var(--line);color:var(--muted);}
  .btn-del{background:transparent;border:1px solid var(--cancel);color:var(--cancel);}
  .btn:disabled{opacity:.5;cursor:default;}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .filters{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--cream);
    cursor:pointer;font-size:13px;color:var(--muted);}
  .chip.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .spacer{flex:1;}
  .count{font-size:13px;color:var(--muted);}

  /* バッジ */
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
  .b-paid{background:var(--paid);} .b-unpaid{background:var(--unpaid);}
  .b-cancel{background:var(--cancel);} .b-free{background:var(--free);}

  /* カード（予約） */
  .card{background:var(--cream);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .card .name{font-size:16px;font-weight:700;}
  .card .meta{font-size:12.5px;color:var(--muted);}
  .card .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13.5px;margin:8px 0;}
  .card .grid b{color:var(--muted);font-weight:600;font-size:12px;display:block;}
  .card .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .line-yes{color:var(--paid);font-size:11.5px;}
  .line-no{color:var(--unpaid);font-size:11.5px;}

  /* 講座リスト */
  .course-row{background:var(--cream);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;}
  .course-row .ctop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .course-row .ctitle{font-size:15.5px;font-weight:700;}
  .course-row .cseries{font-size:12px;color:var(--gold);font-weight:700;}
  .course-row .cmeta{font-size:13px;color:var(--muted);margin-top:4px;}
  .course-row .cactions{display:flex;gap:8px;margin-top:10px;}
  .course-row.is-past{opacity:.6;}
  .past-tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--muted);
    border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle;}

  /* シリーズグループ */
  .series-group{margin-bottom:22px;}
  .series-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:9px 13px;margin-bottom:10px;border-left:4px solid var(--gold);
    background:#FBF7EF;border-radius:8px;}
  .series-head .sname{font-size:15px;font-weight:700;color:var(--ink);}
  .series-head .scount{font-size:12.5px;color:var(--muted);}
  .course-sub{font-size:13.5px;font-weight:700;color:var(--ink);margin:10px 2px 8px;
    padding-left:4px;border-left:3px solid var(--line);}
  .course-sub .csub-date{color:var(--muted);font-weight:400;}
  .course-sub .csub-count{color:var(--gold);font-weight:700;}

  /* シリーズ絞り込みボタン */
  .series-filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;}
  .schip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--cream);cursor:pointer;font-size:13px;color:var(--ink);}
  .schip .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;}
  .schip.active{color:#fff;border-color:transparent;font-weight:700;}
  .schip.active .dot{background:#fff !important;}

  /* 管理カレンダー */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;}
  .cal-title{font-weight:700;font-size:16px;color:var(--ink);}
  .cal-nav{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{margin-bottom:6px;}
  .cal-dow div{text-align:center;font-size:11px;color:var(--muted);}
  .acell{min-height:62px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;padding:4px;border-radius:10px;font-size:12px;border:1px solid var(--line);background:#FBF8F2;color:var(--ink);cursor:pointer;text-align:left;overflow:hidden;}
  .acell.empty{visibility:hidden;cursor:default;}
  .acell:hover{border-color:var(--gold);}
  .acell .ad{font-size:12px;font-weight:700;padding-left:2px;}
  .acell.has{background:#fff;}
  .aevs{display:flex;flex-direction:column;gap:2px;}
  .aev{font-size:10.5px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-day{margin-top:16px;}
  .cal-daylabel{font-size:15px;font-weight:700;color:var(--ink);margin:6px 0 10px;}

  /* 一括登録プレビュー */
  .bulk-prev{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .bulk-prev .bp-head{background:#FBF7EF;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .bp-row{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid #f0ebe0;font-size:13px;}
  .bp-row .bp-id{color:#b9b1a3;font-size:12px;}
  .bp-row.shift{background:#FBF1E8;}
  .bp-tag{font-size:11px;color:#B07A2E;font-weight:700;}

  /* 参加者名簿（同じ枠に複数名） */
  .course-box{background:var(--cream);border:1px solid var(--line);border-left-width:5px;
    border-radius:12px;padding:12px 15px;margin-bottom:12px;}
  .cbox-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .cbox-title{font-size:15px;font-weight:700;color:var(--ink);}
  .cbox-date{font-size:12.5px;color:var(--muted);}
  .cbox-count{font-size:12.5px;color:var(--gold);font-weight:700;margin-left:auto;}
  .proster{display:flex;flex-direction:column;}
  .prow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
    padding:9px 0;border-bottom:1px solid #f0ebe0;}
  .prow:last-child{border-bottom:none;}
  .pinfo{min-width:0;}
  .pname{font-size:15px;font-weight:700;}
  .psub{font-size:12px;color:var(--muted);margin-top:2px;}
  .pacts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}
  @media(max-width:560px){
    .prow{flex-direction:column;}
    .pacts{justify-content:flex-start;}
  }

  /* フォーム */
  .form-panel{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .form-panel h3{margin:0 0 12px;font-size:16px;}
  .fg{margin-bottom:12px;}
  .fg label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px;}
  .fg .hint{font-weight:400;color:var(--muted);font-size:11.5px;}
  .fg input,.fg select,.fg textarea{width:100%;padding:10px;border:1px solid var(--line);
    border-radius:8px;font-size:14.5px;background:#fff;}
  .fg textarea{min-height:60px;resize:vertical;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}

  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .hide{display:none !important;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:var(--cream);padding:11px 20px;border-radius:8px;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}

  @media(max-width:560px){
    .card .grid{grid-template-columns:1fr;}
    .frow{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="loginView">
  <div class="login-card">
    <h2>植物美容学校 講習予約システム</h2>
    <p>スタッフ用のパスワードを入力してください</p>
    <div class="err" id="loginErr"></div>
    <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" />
    <button class="btn btn-primary" style="width:100%;" id="loginBtn">ログイン</button>
  </div>
</div>

<!-- 管理画面 -->
<div id="appView" class="hide">
  <header>
    <div class="wrap">
      <div>
        <h1>植物美容学校 講習予約システム</h1>
        <div class="sub">管理ページ</div>
      </div>
      <div class="head-actions">
        <a class="logout-btn" href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener">📅 カレンダー</a>
        <a class="logout-btn" href="https://zoom.us/" target="_blank" rel="noopener">🎥 Zoom</a>
        <a class="logout-btn" href="https://manager.line.biz/" target="_blank" rel="noopener">💬 公式LINE</a>
        <a class="logout-btn" href="https://ymiyagawatheherbs-tech.github.io/school-apply/manual.html" target="_blank" rel="noopener">📖 マニュアル</a>
        <button class="logout-btn" id="logoutBtn">ログアウト</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <div class="tab active" id="tabBookings">予約管理</div>
      <div class="tab" id="tabCourses">講座管理</div>
      <div class="tab" id="tabMembers">会員管理</div>
    </div>

    <!-- 予約管理 -->
    <div id="viewBookings">
      <div class="toolbar">
        <div class="filters" id="bkFilters">
          <span class="chip active" data-f="all">すべて</span>
          <span class="chip" data-f="未入金">未入金</span>
          <span class="chip" data-f="入金済">入金済</span>
          <span class="chip" data-f="無料">無料</span>
          <span class="chip" data-f="キャンセル">キャンセル</span>
        </div>
        <span class="spacer"></span>
        <span class="count" id="bkCount"></span>
        <button class="btn btn-ghost btn-sm" id="bkReload">更新</button>
      </div>
      <div class="series-filters" id="bkSeriesFilters"></div>
      <div id="bkList"></div>
    </div>

    <!-- 講座管理 -->
    <div id="viewCourses" class="hide">
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" id="newCourseBtn">＋ 新規講座を追加</button>
        <button class="btn btn-ghost btn-sm" id="bulkBtn">🔁 繰り返しで一括登録</button>
        <span class="spacer"></span>
        <span class="count" id="csCount"></span>
        <button class="btn btn-ghost btn-sm" id="csViewToggle">📅 カレンダー表示</button>
        <button class="btn btn-ghost btn-sm" id="csPastToggle">過去も表示</button>
        <button class="btn btn-ghost btn-sm" id="csReload">更新</button>
      </div>
      <div class="series-filters" id="csSeriesFilters"></div>
      <div class="series-filters" id="csMonthFilters"></div>
      <div id="csCalWrap" class="hide"></div>

      <!-- 講座フォーム -->
      <div class="form-panel hide" id="courseForm">
        <h3 id="formTitle">新規講座を追加</h3>
        <div class="frow">
          <div class="fg">
            <label>講座ID <span class="hint">例：HS-v-260801（編集時は変更不可）</span></label>
            <input id="f_id" placeholder="HS-v-260801" />
          </div>
          <div class="fg">
            <label>シリーズ名 <span class="hint">既存から選ぶ／新規は下で作成</span></label>
            <select id="f_series_sel">
              <option value="">— 選択してください —</option>
              <option value="__new__">＋ 新しいシリーズを作成…</option>
            </select>
            <input id="f_series_new" class="hide" placeholder="新しいシリーズ名（URLと一致させる）" style="margin-top:8px;" />
          </div>
        </div>
        <div class="fg">
          <label>タイトル</label>
          <input id="f_title" placeholder="ヴェルデケア" />
        </div>
        <div class="frow">
          <div class="fg">
            <label>開催日時（開始）</label>
            <input type="datetime-local" id="f_date" />
          </div>
          <div class="fg">
            <label>終了日時 <span class="hint">カレンダー用。2日間は最終日を指定</span></label>
            <input type="datetime-local" id="f_end" />
          </div>
        </div>
        <div class="fg">
          <label>場所 <span class="hint">オンラインは「オンライン（Zoom）」</span></label>
          <input id="f_place" placeholder="植物美容学校 / オンライン（Zoom）" />
        </div>
        <div class="frow">
          <div class="fg"><label>定員</label><input type="number" id="f_capacity" placeholder="10" /></div>
          <div class="fg"><label>タグ <span class="hint">例：体験会 / 講習会</span></label><input id="f_tag" placeholder="講習会" /></div>
        </div>
        <div class="frow">
          <div class="fg"><label>会員価格（円）</label><input type="number" id="f_pm" placeholder="0" /></div>
          <div class="fg"><label>通常価格（円）</label><input type="number" id="f_pn" placeholder="0" /></div>
        </div>
        <div class="fg">
          <label>Zoom URL <span class="hint">オンラインのみ。入金済・無料の方にだけ送られます</span></label>
          <input id="f_zoom" placeholder="https://us02web.zoom.us/j/..." />
        </div>
        <div class="frow">
          <div class="fg">
            <label>ステータス</label>
            <select id="f_status"><option>募集中</option><option>終了</option><option>非公開</option></select>
          </div>
          <div class="fg"><label>備考</label><textarea id="f_notes" placeholder="2日間講習会の日程など"></textarea></div>
        </div>
        <div class="err" id="formErr"></div>
        <div class="form-actions">
          <button class="btn btn-primary" id="saveCourseBtn">保存</button>
          <button class="btn btn-ghost" id="cancelCourseBtn">キャンセル</button>
        </div>
      </div>

      <!-- 一括登録フォーム -->
      <div class="form-panel hide" id="bulkForm">
        <h3>🔁 繰り返しで一括登録</h3>
        <p class="hint" style="margin:0 0 14px;">同じ講座を、曜日・間隔・回数（または終了日）でまとめて登録します。祝日に当たる回は自動で翌週へずらせます。<b>プレビューで確認してから登録</b>してください。</p>
        <div class="frow">
          <div class="fg">
            <label>シリーズ名</label>
            <select id="b_series"><option value="">— 選択 —</option></select>
          </div>
          <div class="fg">
            <label>講座IDの接頭辞 <span class="hint">例：HS-v →  HS-v-260805 のように自動採番</span></label>
            <input id="b_prefix" placeholder="HS-v" />
          </div>
        </div>
        <div class="fg"><label>タイトル</label><input id="b_title" placeholder="ヴェルデケア" /></div>
        <div class="frow">
          <div class="fg"><label>開始日（1回目）</label><input type="date" id="b_startdate" /></div>
          <div class="fg">
            <label>1回の長さ</label>
            <select id="b_span"><option value="1">単日</option><option value="2">2日間（翌日まで）</option></select>
          </div>
        </div>
        <div class="frow">
          <div class="fg"><label>開始時刻</label><input type="time" id="b_starttime" value="10:00" /></div>
          <div class="fg"><label>終了時刻</label><input type="time" id="b_endtime" value="16:00" /></div>
        </div>
        <div class="fg">
          <label>間隔</label>
          <select id="b_interval">
            <option value="weekly">毎週（同じ曜日）</option>
            <option value="biweekly">隔週（2週ごと）</option>
            <option value="every3w">3週ごと</option>
            <option value="every4w">4週ごと</option>
            <option value="monthly_nth">毎月・第◯◯曜日（開始日と同じ位置）</option>
            <option value="monthly_day">毎月・同じ日</option>
          </select>
        </div>
        <div class="frow">
          <div class="fg"><label>回数 <span class="hint">回数だけ・終了日だけ・両方どれでも可</span></label><input type="number" id="b_count" placeholder="12" min="1" /></div>
          <div class="fg"><label>終了日</label><input type="date" id="b_until" /></div>
        </div>
        <div class="fg">
          <label><input type="checkbox" id="b_skipholidays" checked style="width:auto;margin-right:6px;" />日本の祝日に当たったら翌週へずらす</label>
        </div>
        <div class="fg">
          <label>その他の休業日（任意） <span class="hint">YYYY-MM-DD を改行で。例：2026-08-13</span></label>
          <textarea id="b_skipdates" placeholder="2026-08-13&#10;2026-12-29"></textarea>
        </div>
        <hr style="border:none;border-top:1px solid var(--line);margin:14px 0;" />
        <div class="frow">
          <div class="fg"><label>場所</label><input id="b_place" placeholder="植物美容学校 / オンライン（Zoom）" /></div>
          <div class="fg"><label>定員</label><input type="number" id="b_cap" placeholder="10" /></div>
        </div>
        <div class="frow">
          <div class="fg"><label>会員価格（円）</label><input type="number" id="b_pm" placeholder="0" /></div>
          <div class="fg"><label>通常価格（円）</label><input type="number" id="b_pn" placeholder="0" /></div>
        </div>
        <div class="fg"><label>Zoom URL（任意）</label><input id="b_zoom" placeholder="https://us02web.zoom.us/j/..." /></div>
        <div class="frow">
          <div class="fg"><label>タグ</label><input id="b_tag" placeholder="講習会" /></div>
          <div class="fg"><label>ステータス</label><select id="b_status"><option>募集中</option><option>終了</option><option>非公開</option></select></div>
        </div>
        <div class="fg"><label>備考（任意）</label><textarea id="b_notes"></textarea></div>
        <div class="err" id="bulkErr"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="bulkPreviewBtn">プレビュー（日付を確認）</button>
          <button class="btn btn-ghost" id="bulkCancelBtn">キャンセル</button>
        </div>
        <div id="bulkPreview"></div>
      </div>

      <div id="csList"></div>
    </div>

    <!-- 会員管理 -->
    <div id="viewMembers" class="hide">
      <div class="toolbar" style="margin-bottom:14px;">
        <div></div>
        <button class="btn btn-primary btn-sm" onclick="$('memberForm').classList.toggle('hide')">＋ 会員を追加</button>
      </div>

      <!-- 追加フォーム -->
      <div class="form-panel hide" id="memberForm" style="margin-bottom:16px;">
        <h3 style="margin:0 0 12px;font-size:15px;">会員を追加</h3>
        <div class="frow">
          <div class="fg">
            <label>サロン名・会社名</label>
            <input id="mf_salon" placeholder="○○サロン" />
          </div>
          <div class="fg">
            <label>メールアドレス <span style="color:#a04a3a;font-size:11px;">必須</span></label>
            <input id="mf_email" type="email" placeholder="info@salon.com" />
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" onclick="addMember()">追加する</button>
          <button class="btn btn-sm" style="background:var(--bg);" onclick="$('memberForm').classList.add('hide')">キャンセル</button>
        </div>
      </div>

      <div id="mbrList"><div class="empty">読み込み中…</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://herbs-booking-api.vercel.app/api/admin';
let PW = sessionStorage.getItem('herbs_admin_pw') || '';
let BOOKINGS = [], COURSES = [], SERIES_LIST = [], BK_FILTER = 'all', BK_SERIES = 'all', CS_SERIES = 'all', CS_VIEW = 'list', CS_MONTH = 'all', CS_CAL_Y = 0, CS_CAL_M = 0, SHOW_PAST = false, EDIT_ID = null;

const $ = id => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function copyApplyUrl(seriesId,courseId){
  const base='https://ymiyagawatheherbs-tech.github.io/school-apply/apply.html';
  const url=seriesId
    ?`${base}?series=${encodeURIComponent(seriesId)}&course=${encodeURIComponent(courseId)}`
    :`${base}?course=${encodeURIComponent(courseId)}`;
  navigator.clipboard.writeText(url).then(()=>toast('URLをコピーしました')).catch(()=>{prompt('URLをコピーしてください',url);});
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* シリーズごとの色（名前から固定で決まる） */
const SERIES_COLORS = ['#859A93','#C9A86A','#9C7A8A','#7E9AAE','#6E8E7B','#B0855A','#A8788F','#5C7F6B'];
function colorForSeries(name){
  let h=0; const s=String(name||'');
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return SERIES_COLORS[h % SERIES_COLORS.length];
}
/* シリーズ絞り込みボタンのHTML */
function seriesChipsHTML(names, current){
  let html = `<span class="schip ${current==='all'?'active':''}" data-s="all" ${current==='all'?'style="background:var(--ink)"':''}>すべて</span>`;
  for(const n of names){
    const col = colorForSeries(n);
    const active = current===n;
    html += `<span class="schip ${active?'active':''}" data-s="${esc(n)}"${active?` style="background:${col}"`:''}>`
      + `<span class="dot" style="background:${col}"></span>${esc(n)}</span>`;
  }
  return html;
}

async function call(action, extra={}){
  const r = await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: PW, action, ...extra }),
  });
  let data={}; try{ data=await r.json(); }catch(e){}
  if (r.status===401){ logout(); throw new Error(data.error||'パスワードが違います'); }
  if (!r.ok) throw new Error(data.error||'エラーが発生しました');
  return data;
}

/* ===== ログイン ===== */
async function login(){
  PW = $('pw').value.trim();
  $('loginErr').textContent='';
  if(!PW){ $('loginErr').textContent='パスワードを入力してください'; return; }
  try{
    await call('listBookings');
    sessionStorage.setItem('herbs_admin_pw', PW);
    showApp();
  }catch(e){ $('loginErr').textContent = e.message; }
}
function logout(){
  sessionStorage.removeItem('herbs_admin_pw'); PW='';
  $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); $('pw').value='';
}
function showApp(){
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  loadBookings(); loadCourses();
}

/* ===== タブ ===== */
$('tabBookings').onclick=()=>{
  ['tabBookings','tabCourses','tabMembers'].forEach(id=>$(id).classList.remove('active'));
  $('tabBookings').classList.add('active');
  $('viewBookings').classList.remove('hide');
  $('viewCourses').classList.add('hide');
  $('viewMembers').classList.add('hide');
};
$('tabCourses').onclick=()=>{
  ['tabBookings','tabCourses','tabMembers'].forEach(id=>$(id).classList.remove('active'));
  $('tabCourses').classList.add('active');
  $('viewCourses').classList.remove('hide');
  $('viewBookings').classList.add('hide');
  $('viewMembers').classList.add('hide');
};
$('tabMembers').onclick=()=>{
  ['tabBookings','tabCourses','tabMembers'].forEach(id=>$(id).classList.remove('active'));
  $('tabMembers').classList.add('active');
  $('viewMembers').classList.remove('hide');
  $('viewBookings').classList.add('hide');
  $('viewCourses').classList.add('hide');
  loadMembers();
};

/* ===== 会員管理 ===== */
let MEMBERS=[];
async function loadMembers(){
  $('mbrList').innerHTML='<div class="empty">読み込み中…</div>';
  try{
    const d=await call('listMembers');
    MEMBERS=d.members||[];
    renderMembers();
  }catch(e){ $('mbrList').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function renderMembers(){
  if(!MEMBERS.length){ $('mbrList').innerHTML='<div class="empty">会員が登録されていません</div>'; return; }
  let h=`<table style="width:100%;border-collapse:collapse;font-size:14px;">
    <thead><tr style="border-bottom:2px solid var(--line);text-align:left;">
      <th style="padding:10px 12px;color:var(--muted);font-weight:500;">サロン名・会社名</th>
      <th style="padding:10px 12px;color:var(--muted);font-weight:500;">メールアドレス</th>
      <th style="padding:10px 12px;color:var(--muted);font-weight:500;">登録日</th>
      <th style="padding:10px 12px;"></th>
    </tr></thead><tbody>`;
  MEMBERS.forEach(m=>{
    const dt=m.created_at ? new Date(m.created_at).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'}) : '—';
    h+=`<tr style="border-bottom:1px solid var(--line);">
      <td style="padding:10px 12px;font-weight:500;">${esc(m.salon_name||m.name||'—')}</td>
      <td style="padding:10px 12px;font-family:monospace;font-size:13px;">${esc(m.email)}</td>
      <td style="padding:10px 12px;color:var(--muted);font-size:13px;">${dt}</td>
      <td style="padding:10px 12px;text-align:right;">
        <button class="btn btn-sm btn-del" onclick="deleteMember('${esc(m.id||m.email)}','${esc(m.email)}')">削除</button>
      </td>
    </tr>`;
  });
  h+=`</tbody></table>`;
  h+=`<div style="margin-top:10px;font-size:13px;color:var(--muted);">合計 ${MEMBERS.length} 名</div>`;
  $('mbrList').innerHTML=h;
}
async function addMember(){
  const salon=$('mf_salon').value.trim();
  const email=$('mf_email').value.trim();
  if(!email){ toast('メールアドレスを入力してください'); return; }
  try{
    await call('addMember',{salon,email});
    toast('会員を追加しました');
    $('mf_salon').value=''; $('mf_email').value='';
    $('memberForm').classList.add('hide');
    await loadMembers();
  }catch(e){ toast(e.message); }
}
async function deleteMember(id,email){
  if(!confirm(`「${email}」を会員から削除しますか？`)) return;
  try{
    await call('deleteMember',{id,email});
    toast('削除しました');
    await loadMembers();
  }catch(e){ toast(e.message); }
}

/* ===== 予約管理 ===== */
function fmtDate(iso){ if(!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}); }
function badge(s){ const m={'入金済':'b-paid','未入金':'b-unpaid','キャンセル':'b-cancel','無料':'b-free'}; return `<span class="badge ${m[s]||''}">${esc(s)}</span>`; }

async function loadBookings(){
  $('bkList').innerHTML='<div class="empty">読み込み中…</div>';
  try{ const d=await call('listBookings'); BOOKINGS=d.bookings||[]; renderBookings(); }
  catch(e){ $('bkList').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function renderBookings(){
  // シリーズ絞り込みボタン（全予約から作成）
  const allSeries = [...new Set(BOOKINGS.map(b=>b.series||'（シリーズ未設定）'))];
  $('bkSeriesFilters').innerHTML = seriesChipsHTML(allSeries, BK_SERIES);
  $('bkSeriesFilters').querySelectorAll('.schip').forEach(c=>c.onclick=()=>{ BK_SERIES=c.dataset.s; renderBookings(); });

  // 状態 → シリーズ の順で絞り込み
  let list = BK_FILTER==='all' ? BOOKINGS : BOOKINGS.filter(b=>b.payment_status===BK_FILTER);
  if(BK_SERIES!=='all') list = list.filter(b=>(b.series||'（シリーズ未設定）')===BK_SERIES);
  $('bkCount').textContent = `${list.length}件`;
  if(!list.length){ $('bkList').innerHTML='<div class="empty">該当する予約はありません</div>'; return; }

  // シリーズ → 講座 でグループ化
  const groups = new Map();
  for(const b of list){
    const sk = b.series || '（シリーズ未設定）';
    if(!groups.has(sk)) groups.set(sk, { count:0, courses:new Map() });
    const g = groups.get(sk); g.count++;
    const ck = b.course_id || '（講座不明）';
    if(!g.courses.has(ck)) g.courses.set(ck, { title:b.course_title, date:b.course_date, items:[] });
    g.courses.get(ck).items.push(b);
  }
  let html = '';
  for(const [sname, g] of groups){
    const col = colorForSeries(sname);
    html += `<div class="series-group"><div class="series-head" style="border-left-color:${col};background:${col}1f"><span class="sname">${esc(sname)}</span><span class="scount">予約 ${g.count}件</span></div>`;
    for(const [, cg] of g.courses){
      html += `<div class="course-box" style="border-left-color:${col}">`
        + `<div class="cbox-head"><span class="cbox-title">${esc(cg.title)}</span><span class="cbox-date">${fmtDate(cg.date)}</span><span class="cbox-count">参加 ${cg.items.length}名</span></div>`
        + `<div class="proster">${cg.items.map(b=>participantRow(b)).join('')}</div>`
        + `</div>`;
    }
    html += `</div>`;
  }
  $('bkList').innerHTML = html;
}
function participantRow(b){
  const line = b.line_linked ? '<span class="line-yes">● LINE</span>' : '<span class="line-no">○ 未連携</span>';
  const price = Number(b.price)>0 ? ('¥'+Number(b.price).toLocaleString()) : '無料';
  return `<div class="prow">
      <div class="pinfo">
        <div><span class="pname">${esc(b.name)}</span>　${badge(b.payment_status)}　${line}</div>
        <div class="psub">${esc(b.member_type)} ／ ${price}</div>
        <div class="psub">${esc(b.email)}　${esc(b.phone)}　<span style="color:#b9b1a3">${esc(b.id)}</span></div>
      </div>
      <div class="pacts">${actions(b)}</div>
    </div>`;
}
function actions(b){
  const s=b.payment_status; const out=[];
  if(s!=='入金済' && s!=='無料') out.push(`<button class="btn btn-sm btn-paid" onclick="setStatus('${b.id}','入金済')">入金済にする</button>`);
  if(s==='入金済') out.push(`<button class="btn btn-sm btn-undo" onclick="setStatus('${b.id}','未入金')">未入金に戻す</button>`);
  if(s!=='キャンセル') out.push(`<button class="btn btn-sm btn-cancel" onclick="setStatus('${b.id}','キャンセル')">キャンセル</button>`);
  if(s==='キャンセル') out.push(`<button class="btn btn-sm btn-undo" onclick="setStatus('${b.id}','未入金')">取消を戻す</button>`);
  if(b.payment_url) out.push(`<a class="btn btn-sm btn-ghost" href="${esc(b.payment_url)}" target="_blank" rel="noopener">決済リンク</a>`);
  return out.join('');
}
async function setStatus(id,status){
  if(status==='キャンセル' && !confirm('この予約をキャンセルにしますか？')) return;
  try{ await call('updateBookingStatus',{id,status});
    const b=BOOKINGS.find(x=>x.id===id); if(b) b.payment_status=status;
    renderBookings(); toast('更新しました'); }
  catch(e){ toast(e.message); }
}
$('bkReload').onclick=loadBookings;
$('bkFilters').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  $('bkFilters').querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); BK_FILTER=c.dataset.f; renderBookings();
});

/* ===== 講座管理 ===== */
async function loadCourses(){
  $('csList').innerHTML='<div class="empty">読み込み中…</div>';
  try{ const d=await call('listCourses'); COURSES=d.courses||[]; SERIES_LIST=d.series||[]; renderCourses(); fillSeriesSelect(); }
  catch(e){ $('csList').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function fillSeriesSelect(){
  const set=[...new Set([...SERIES_LIST, ...COURSES.map(c=>c.series_id)].filter(Boolean))];
  const opts = ['<option value="">— 選択してください —</option>']
    .concat(set.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`))
    .concat(['<option value="__new__">＋ 新しいシリーズを作成…</option>']);
  $('f_series_sel').innerHTML = opts.join('');
}
function isPastCourse(c){
  const ds = c.course_end || c.course_date;
  if(!ds) return false; // 日付未設定は過去扱いしない
  const dayJST = d => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  return dayJST(new Date(ds)) < dayJST(new Date()); // 開催日（最終日）が今日より前なら過去
}
function ymdJST(iso){
  const dt = iso instanceof Date ? iso : new Date(iso);
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(dt);
  const [y,m,d]=p.split('-').map(Number); return {y,m,d};
}
function ymJST(iso){ const o=ymdJST(iso); return `${o.y}-${String(o.m).padStart(2,'0')}`; }
function monthChipsHTML(months,current){
  let html=`<span class="schip ${current==='all'?'active':''}" data-m="all" ${current==='all'?'style="background:var(--ink)"':''}>全月</span>`;
  for(const mk of months){ const [y,m]=mk.split('-'); const active=current===mk;
    html+=`<span class="schip ${active?'active':''}" data-m="${mk}" ${active?'style="background:var(--sage)"':''}>${y}年${Number(m)}月</span>`; }
  return html;
}
function renderCourses(){
  // シリーズ絞り込みボタン
  const allSeries=[...new Set(COURSES.map(c=>c.series_id||'（シリーズ未設定）'))];
  $('csSeriesFilters').innerHTML=seriesChipsHTML(allSeries,CS_SERIES);
  $('csSeriesFilters').querySelectorAll('.schip').forEach(c=>c.onclick=()=>{ CS_SERIES=c.dataset.s; renderCourses(); });
  $('csViewToggle').textContent = CS_VIEW==='calendar' ? '☰ リスト表示' : '📅 カレンダー表示';

  if(CS_VIEW==='calendar'){
    $('csMonthFilters').classList.add('hide');
    $('csList').classList.add('hide');
    $('csCalWrap').classList.remove('hide');
    $('csPastToggle').style.display='none';
    renderAdminCalendar();
    return;
  }
  // ---- リスト表示 ----
  $('csCalWrap').classList.add('hide');
  $('csList').classList.remove('hide');
  $('csMonthFilters').classList.remove('hide');

  // 月の絞り込みボタン
  const monthsAvail=[...new Set(COURSES.filter(c=>c.course_date).map(c=>ymJST(c.course_date)))].sort();
  $('csMonthFilters').innerHTML=monthChipsHTML(monthsAvail,CS_MONTH);
  $('csMonthFilters').querySelectorAll('.schip').forEach(c=>c.onclick=()=>{ CS_MONTH=c.dataset.m; renderCourses(); });

  // 絞り込み（シリーズ → 月 → 過去）
  let courses = CS_SERIES==='all' ? COURSES : COURSES.filter(c=>(c.series_id||'（シリーズ未設定）')===CS_SERIES);
  if(CS_MONTH!=='all') courses = courses.filter(c=>c.course_date && ymJST(c.course_date)===CS_MONTH);
  const pastCount = courses.filter(isPastCourse).length;
  if(!SHOW_PAST) courses = courses.filter(c=>!isPastCourse(c));
  const tBtn=$('csPastToggle');
  if(tBtn){ tBtn.textContent = SHOW_PAST ? '過去を隠す' : `過去も表示${pastCount?`（${pastCount}件）`:''}`;
    tBtn.style.display = (pastCount>0||SHOW_PAST) ? '' : 'none'; }

  $('csCount').textContent=`${courses.length}件`;
  if(!courses.length){
    $('csList').innerHTML = pastCount>0
      ? '<div class="empty">表示できる講座がありません（過去のみ）。「過去も表示」で確認できます。</div>'
      : '<div class="empty">この条件の講座はありません。</div>';
    return;
  }
  const groups=new Map();
  for(const c of courses){ const sk=c.series_id||'（シリーズ未設定）';
    if(!groups.has(sk)) groups.set(sk,{count:0,bookings:0,items:[]});
    const g=groups.get(sk); g.count++; g.bookings+=(c.booking_count||0); g.items.push(c); }
  let html='';
  for(const [sname,g] of groups){
    const col=colorForSeries(sname);
    html+=`<div class="series-group"><div class="series-head" style="border-left-color:${col};background:${col}1f"><span class="sname">${esc(sname)}</span><span class="scount">講座 ${g.count}件 ／ 予約合計 ${g.bookings}件</span></div>`;
    html+=g.items.map(c=>{ const past=isPastCourse(c);
      return `
      <div class="course-row${past?' is-past':''}" style="border-left:5px solid ${col}">
        <div class="ctop">
          <div>
            <div class="ctitle">${esc(c.title)}${past?' <span class="past-tag">終了</span>':''}</div>
            <div class="cmeta">${fmtDate(c.course_date)} ／ ${esc(c.place||'—')} ／ 定員${c.capacity??'—'}　予約${c.booking_count}件</div>
            <div class="cmeta">会員¥${Number(c.price_member||0).toLocaleString()} ／ 通常¥${Number(c.price_normal||0).toLocaleString()} ／ ${esc(c.status||'')}${c.zoom_url?' ／ Zoom設定あり':''}</div>
            <div class="cmeta" style="color:#b9b1a3;">${esc(c.id)}</div>
          </div>
          <div><div class="cactions">
            <button class="btn btn-sm btn-ghost" onclick="copyApplyUrl('${esc(c.series_id||'')}','${esc(c.id)}')">🔗 URL</button>
            <button class="btn btn-sm btn-ghost" onclick="editCourse('${esc(c.id)}')">編集</button>
            <button class="btn btn-sm btn-ghost" onclick="duplicateCourse('${esc(c.id)}')">複製</button>
            <button class="btn btn-sm btn-del" onclick="delCourse('${esc(c.id)}')">削除</button>
          </div></div>
        </div>
      </div>`; }).join('');
    html+=`</div>`;
  }
  $('csList').innerHTML=html;
}

/* ===== 管理カレンダー ===== */
function renderAdminCalendar(){
  const wrap=$('csCalWrap');
  if(!CS_CAL_Y){ const o=ymdJST(new Date()); CS_CAL_Y=o.y; CS_CAL_M=o.m; }
  const y=CS_CAL_Y, mo=CS_CAL_M;
  let cs = CS_SERIES==='all' ? COURSES : COURSES.filter(c=>(c.series_id||'（シリーズ未設定）')===CS_SERIES);
  cs = cs.filter(c=>c.course_date);
  const byDay={};
  cs.forEach(c=>{ const o=ymdJST(c.course_date); if(o.y===y&&o.m===mo)(byDay[o.d]=byDay[o.d]||[]).push(c); });
  const startDow=new Date(y,mo-1,1).getDay();
  const dim=new Date(y,mo,0).getDate();
  let h=`<div class="cal-head">
      <button type="button" class="cal-nav" onclick="adminCalMove(-1)">‹</button>
      <div class="cal-title">${y}年${mo}月</div>
      <button type="button" class="cal-nav" onclick="adminCalMove(1)">›</button>
    </div>
    <div class="cal-grid cal-dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="cal-grid">`;
  for(let i=0;i<startDow;i++) h+='<div class="acell empty"></div>';
  for(let d=1;d<=dim;d++){ const items=byDay[d]||[];
    let evs='';
    if(items.length){ evs='<div class="aevs">'+items.map(c=>{ const col=colorForSeries(c.series_id||'');
      return `<span class="aev" style="background:${col}22;border-left:3px solid ${col}">${esc(c.title)}</span>`; }).join('')+'</div>'; }
    h+=`<button type="button" class="acell${items.length?' has':''}" onclick="adminCalDay(${y},${mo},${d})"><span class="ad">${d}</span>${evs}</button>`; }
  h+='</div><div id="csCalDay" class="cal-day"></div>';
  wrap.innerHTML=h;
  const cnt=cs.filter(c=>{const o=ymdJST(c.course_date);return o.y===y&&o.m===mo;}).length;
  $('csCount').textContent=`${cnt}件（${mo}月）`;
}

    return `<div class="course-row" style="border-left:5px solid ${col};margin-bottom:10px;">
      <div class="ctop"><div style="flex:1;">
        <div class="ctitle">${esc(c.title)}</div>

          <tr><td style="padding-right:12px;white-space:nowrap;">🆔 講座ID</td><td style="font-family:monospace;color:var(--ink);font-weight:600;">${esc(c.id)}</td></tr>
          <tr><td style="padding-right:12px;white-space:nowrap;">🕐 時間</td><td style="color:var(--ink);">${timeRange}</td></tr>
          <tr><td style="padding-right:12px;white-space:nowrap;">📍 場所</td><td>${esc(c.place||'—')}</td></tr>
          <tr><td style="padding-right:12px;white-space:nowrap;">👥 定員 ／ 予約</td><td>${c.capacity??'—'} 名 ／ <strong>${c.booking_count}</strong> 件</td></tr>
          <tr><td style="padding-right:12px;white-space:nowrap;">💴 会員 ／ 非会員</td><td>${pm} ／ ${pn}</td></tr>
          <tr><td style="padding-right:12px;white-space:nowrap;">📂 シリーズ</td><td>${esc(c.series_id||'—')}</td></tr>
        </table>
      </div><div><div class="cactions" style="margin-top:4px;">
        <button class="btn btn-sm btn-ghost" onclick="copyApplyUrl('${esc(c.series_id||'')}','${esc(c.id)}')">🔗 URL</button>
        <button class="btn btn-sm btn-ghost" onclick="editCourse('${esc(c.id)}')">編集</button>
        <button class="btn btn-sm btn-ghost" onclick="duplicateCourse('${esc(c.id)}')">複製</button>
        <button class="btn btn-sm btn-del" onclick="delCourse('${esc(c.id)}')">削除</button>
      </div></div></div></div>`; }).join('');
  h+=`<button class="btn btn-primary btn-sm" onclick="openFormOnDate(${y},${mo},${d})">＋ この日に講座を追加</button>`;
  panel.innerHTML=h;

window.openFormOnDate=(y,mo,d)=>{ openForm(null); const pad=n=>String(n).padStart(2,'0');
  $('f_date').value=`${y}-${pad(mo)}-${pad(d)}T10:00`;

/* ===== 繰り返しで一括登録 ===== */
const JP_HOLIDAYS = new Set([
  '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29',
  '2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11',
  '2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
  '2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22',
  '2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11',
  '2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23',
]);
let BULK_PLAN = [];
const WD2=['日','月','火','水','木','金','土'];
function pad2(n){ return String(n).padStart(2,'0'); }
function dkey(dt){ return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function nthWeekdayOfMonth(year, month0, weekday, nth){
  const first=new Date(year,month0,1);
  const offset=(weekday-first.getDay()+7)%7;
  const dt=new Date(year,month0,1+offset+(nth-1)*7);
  return dt.getMonth()===month0 ? dt : null;
}
function openBulk(){
  const sel=$('b_series');
  sel.innerHTML='<option value="">— 選択 —</option>'+(SERIES_LIST||[]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  $('bulkPreview').innerHTML=''; $('bulkErr').textContent='';
  $('courseForm').classList.add('hide');
  $('bulkForm').classList.remove('hide');
  $('bulkForm').scrollIntoView({behavior:'smooth',block:'start'});
}
function closeBulk(){ $('bulkForm').classList.add('hide'); }
function buildBulkDates(){
  const startStr=$('b_startdate').value;
  if(!startStr) throw new Error('開始日を入れてください');
  const interval=$('b_interval').value;
  const count=parseInt($('b_count').value,10);
  const until=$('b_until').value ? new Date($('b_until').value+'T23:59:59') : null;
  if(!count && !until) throw new Error('回数または終了日のどちらかを入れてください');
  const skipHol=$('b_skipholidays').checked;
  const skipSet=new Set(($('b_skipdates').value||'').split(/[\s,]+/).map(s=>s.trim()).filter(Boolean));
  const isSkip=dt=>(skipHol && JP_HOLIDAYS.has(dkey(dt))) || skipSet.has(dkey(dt));
  const start=new Date(startStr+'T00:00:00');
  const weekday=start.getDay();
  const nth=Math.floor((start.getDate()-1)/7)+1;
  const maxN=count?(count*3+24):300;
  const out=[];
  for(let i=0;i<maxN;i++){
    let dt;
    if(interval==='weekly') dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+7*i);
    else if(interval==='biweekly') dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+14*i);
    else if(interval==='every3w') dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+21*i);
    else if(interval==='every4w') dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+28*i);
    else if(interval==='monthly_nth'){ const d=nthWeekdayOfMonth(start.getFullYear(),start.getMonth()+i,weekday,nth); if(!d) continue; dt=d; }
    else if(interval==='monthly_day'){ const d=new Date(start.getFullYear(),start.getMonth()+i,start.getDate()); if(d.getDate()!==start.getDate()) continue; dt=d; }
    else dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+7*i);
    let shifted=false,guard=0;
    while(isSkip(dt)&&guard<8){ dt=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+7); shifted=true; guard++; }
    if(until && dt>until) break;
    out.push({date:dt,shifted});
    if(count && out.length>=count) break;
  }
  return out;
}
function previewBulk(){
  $('bulkErr').textContent='';
  let dates;
  try{ dates=buildBulkDates(); }catch(e){ $('bulkErr').textContent=e.message; $('bulkPreview').innerHTML=''; return; }
  const prefix=$('b_prefix').value.trim(), series=$('b_series').value, title=$('b_title').value.trim();
  if(!series||!title||!prefix){ $('bulkErr').textContent='シリーズ・タイトル・ID接頭辞は必須です'; $('bulkPreview').innerHTML=''; return; }
  if(!dates.length){ $('bulkErr').textContent='生成された日付がありません。条件を見直してください'; $('bulkPreview').innerHTML=''; return; }
  const span=parseInt($('b_span').value,10);
  BULK_PLAN=dates.map(d=>{ const yy=String(d.date.getFullYear()).slice(2);
    return { id:`${prefix}-${yy}${pad2(d.date.getMonth()+1)}${pad2(d.date.getDate())}`, date:d.date, shifted:d.shifted, span }; });
  const rows=BULK_PLAN.map(p=>{ const d=p.date;
    return `<div class="bp-row${p.shifted?' shift':''}"><div>${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD2[d.getDay()]}）${p.span>1?'〜翌日':''}${p.shifted?' <span class="bp-tag">← 祝日のため翌週へ</span>':''}</div><div class="bp-id">${esc(p.id)}</div></div>`; }).join('');
  $('bulkPreview').innerHTML=`<div class="bulk-prev"><div class="bp-head"><span>登録される講座：${BULK_PLAN.length}件</span></div>${rows}</div>`
    +`<button class="btn btn-primary" id="bulkRunBtn" style="margin-top:14px;">この${BULK_PLAN.length}件を一括登録する</button>`;
  $('bulkRunBtn').onclick=runBulk;
}
async function runBulk(){
  const btn=$('bulkRunBtn'); if(!btn||!BULK_PLAN.length) return;
  const tmpl={ series_id:$('b_series').value, title:$('b_title').value.trim(),
    place:$('b_place').value.trim(), capacity:$('b_cap').value,
    price_member:$('b_pm').value, price_normal:$('b_pn').value,
    zoom_url:$('b_zoom').value.trim(), tag:$('b_tag').value.trim(),
    status:$('b_status').value, notes:$('b_notes').value.trim() };
  const st=$('b_starttime').value||'10:00', et=$('b_endtime').value||'16:00';
  btn.disabled=true;
  let ok=0,fail=0; const errs=[];
  for(let i=0;i<BULK_PLAN.length;i++){
    const p=BULK_PLAN[i], d=p.date;
    const ds=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const ed=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(p.span>1?p.span-1:0));
    const de=`${ed.getFullYear()}-${pad2(ed.getMonth()+1)}-${pad2(ed.getDate())}`;
    const course={ ...tmpl, id:p.id, course_date:`${ds}T${st}:00+09:00`, course_end:`${de}T${et}:00+09:00` };
    btn.textContent=`登録中… ${i+1}/${BULK_PLAN.length}`;
    try{ const r=await call('createCourse',{course}); if(r&&r.status==='ok') ok++; else { fail++; errs.push(p.id); } }
    catch(e){ fail++; errs.push(`${p.id}：${e.message}`); }
  }
  await loadCourses();
  closeBulk();
  toast(`一括登録：成功 ${ok}件${fail?` ／ 失敗 ${fail}件`:''}`);
  if(fail) alert('登録できなかった講座があります（ID重複などの可能性）：\n'+errs.join('\n'));
}
function toLocalInput(iso){
  if(!iso) return '';
  const p=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(iso));
  const g=t=>p.find(x=>x.type===t).value;
  return `${g('year')}-${g('month')}-${g('day')}T${g('hour')}:${g('minute')}`;
}
function openForm(course){
  const bf=document.getElementById('bulkForm'); if(bf) bf.classList.add('hide');
  EDIT_ID = course ? course.id : null;
  $('formTitle').textContent = course ? '講座を編集' : '新規講座を追加';
  $('f_id').value = course ? course.id : '';
  $('f_id').disabled = !!course;
  fillSeriesSelect();
  $('f_series_sel').value = course?.series_id || '';
  $('f_series_new').value = '';
  $('f_series_new').classList.add('hide');
  $('f_title').value = course?.title || '';
  $('f_date').value = course?.course_date ? toLocalInput(course.course_date) : '';
  $('f_end').value = course?.course_end ? toLocalInput(course.course_end) : '';
  $('f_place').value = course?.place || '';
  $('f_capacity').value = course?.capacity ?? '';
  $('f_tag').value = course?.tag || '';
  $('f_pm').value = course?.price_member ?? '';
  $('f_pn').value = course?.price_normal ?? '';
  $('f_zoom').value = course?.zoom_url || '';
  $('f_status').value = course?.status || '募集中';
  $('f_notes').value = course?.notes || '';
  $('formErr').textContent='';
  $('courseForm').classList.remove('hide');
  $('courseForm').scrollIntoView({behavior:'smooth',block:'start'});
}
$('newCourseBtn').onclick=()=>openForm(null);
$('cancelCourseBtn').onclick=()=>$('courseForm').classList.add('hide');
window.editCourse=(id)=>{ const c=COURSES.find(x=>x.id===id); if(c) openForm(c); };

$('saveCourseBtn').onclick=async()=>{
  const dt = $('f_date').value;
  const dtEnd = $('f_end').value;
  const seriesSel = $('f_series_sel').value;
  const seriesId = seriesSel === '__new__' ? $('f_series_new').value.trim() : seriesSel;
  const course = {
    id: $('f_id').value.trim(),
    series_id: seriesId,
    title: $('f_title').value.trim(),
    course_date: dt ? dt+':00+09:00' : null,
    course_end: dtEnd ? dtEnd+':00+09:00' : null,
    place: $('f_place').value.trim(),
    capacity: $('f_capacity').value,
    tag: $('f_tag').value.trim(),
    price_member: $('f_pm').value,
    price_normal: $('f_pn').value,
    zoom_url: $('f_zoom').value.trim(),
    status: $('f_status').value,
    notes: $('f_notes').value.trim(),
  };
  if(!course.id || !course.series_id || !course.title){ $('formErr').textContent='ID・シリーズ名・タイトルは必須です'; return; }
  $('saveCourseBtn').disabled=true;
  try{
    let resp;
    if(EDIT_ID) resp = await call('updateCourse',{id:EDIT_ID, course});
    else resp = await call('createCourse',{course});
    $('courseForm').classList.add('hide');
    toast(resp && resp.calendarWarning ? '保存しました（カレンダー連携は失敗）' : '保存しました');
    await loadCourses();
  }catch(e){ $('formErr').textContent=e.message; }
  finally{ $('saveCourseBtn').disabled=false; }
};
window.delCourse=async(id)=>{
  if(!confirm('この講座を削除しますか？（予約がある場合は削除できません）')) return;
  try{ await call('deleteCourse',{id}); toast('削除しました'); await loadCourses(); }
  catch(e){ alert(e.message); }
};
$('csReload').onclick=loadCourses;
$('csPastToggle').onclick=()=>{ SHOW_PAST=!SHOW_PAST; renderCourses(); };
$('csViewToggle').onclick=()=>{ CS_VIEW = (CS_VIEW==='calendar' ? 'list' : 'calendar'); renderCourses(); };
$('bulkBtn').onclick=openBulk;
$('bulkCancelBtn').onclick=closeBulk;
$('bulkPreviewBtn').onclick=previewBulk;
