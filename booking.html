<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ご予約 — THE HERBS SCALP LABO</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F2E9DD; --bgCard:#FFFFFF; --bgSub:#F0EBE3; --bgSelected:#E8EEE4;
    --green:#6E7A5A; --greenDark:#4A5240; --headerGreen:#5A6347; --sage:#A9C0A6; --light:#C5D3C4;
    --border:#DDD5CC; --borderSel:#A9C0A6; --text:#3D3D2E; --textSub:#6B6B5A;
    --textMuted:#9A9A88; --error:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  .mincho{font-family:'Shippori Mincho B1',serif;}
  .wrap{max-width:620px;margin:0 auto;padding:2.5rem 1rem 3rem;}

  /* 固定ヘッダー（深緑バー） */
  .topbar{background:var(--headerGreen);padding:.9rem 1.3rem;display:flex;align-items:center;justify-content:space-between;}
  .topbar .logo-area{display:flex;align-items:center;gap:.7rem;}
  .topbar .logo-area img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:7px;padding:3px;}
  .topbar .logo-text{color:#fff;line-height:1.3;}
  .topbar .logo-text .sub{font-size:.6rem;letter-spacing:.2em;opacity:.85;}
  .topbar .logo-text .main{font-family:'Shippori Mincho B1',serif;font-size:1.15rem;letter-spacing:.15em;font-weight:600;}
  .topbar .formname{color:#fff;font-size:.85rem;opacity:.9;letter-spacing:.05em;}

  /* フッター（深緑バー） */
  .footer{background:var(--headerGreen);padding:2rem 1rem;text-align:center;margin-top:2rem;}
  .footer img{width:40px;height:40px;object-fit:contain;opacity:.55;margin-bottom:.5rem;}
  .footer .copy{color:rgba(255,255,255,.7);font-size:.72rem;letter-spacing:.03em;}

  /* ヘッダー見出し */
  .hero{text-align:center;margin-bottom:2rem;}
  .hero .brand{font-size:.78rem;letter-spacing:.35em;color:var(--sage);margin-bottom:.7rem;font-weight:600;}
  .hero h1{font-family:'Shippori Mincho B1',serif;font-size:2rem;font-weight:700;color:var(--greenDark);margin-bottom:.4rem;letter-spacing:.08em;}
  .hero p{font-size:.85rem;color:var(--textSub);}

  /* ステップインジケーター */
  /* ステップインジケーター（3つを均等幅。番号の丸を必ず同じ高さに固定し、その下にラベル） */
  .steps{display:flex;justify-content:center;gap:0;margin:0 auto 2rem;max-width:400px;}
  .step-dot{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.78rem;color:var(--textMuted);font-weight:600;text-align:center;}
  /* 番号の丸。線はこの行（高さ34px固定）の中に置くので、ラベル文字数に関係なく必ず揃う */
  .step-num-row{position:relative;width:100%;height:34px;display:flex;align-items:center;justify-content:center;}
  .step-dot .num{width:32px;height:32px;border-radius:50%;background:#D6CFC2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700;position:relative;z-index:1;}
  .step-dot.on .num{background:var(--greenDark);}
  .step-dot.done .num{background:var(--sage);}
  .step-dot.on{color:var(--greenDark);}
  .step-label-txt{margin-top:.45rem;line-height:1.3;}
  /* ステップ間をつなぐ線。num-row（高さ34px）の中央＝17pxに引くので、丸の中心に必ず一致 */
  .step-num-row::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:#D6CFC2;z-index:0;}
  .step-dot:first-child .step-num-row::before{display:none;}
  .step-dot.on .step-num-row::before,.step-dot.done .step-num-row::before{background:var(--sage);}

  /* カード */
  .card{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 16px rgba(0,0,0,.03);}
  .section-title{font-family:'Shippori Mincho B1',serif;font-size:1.1rem;font-weight:600;color:var(--green);margin-bottom:1rem;}

  /* STEPラベル */
  .step-label{font-size:.92rem;color:var(--sage);font-weight:600;letter-spacing:.08em;margin-bottom:1.2rem;}

  /* 店舗選択 */
  .store-card{position:relative;background:#fff;border:1px solid #EDE6DB;border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.1rem;cursor:pointer;transition:.15s;box-shadow:0 2px 14px rgba(0,0,0,.04);}
  .store-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
  .store-card.sel{border-color:var(--borderSel);background:var(--bgSelected);}
  .store-card-arrow{position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);color:var(--sage);font-size:1.4rem;}
  .store-card h3{font-size:1.15rem;font-weight:700;color:var(--greenDark);margin-bottom:.7rem;}
  .store-meta{font-size:.85rem;color:var(--textSub);margin-bottom:.3rem;display:flex;gap:.5rem;}
  .store-meta .lbl{color:var(--textMuted);min-width:3.5em;flex-shrink:0;}
  .store-meta:last-of-type{color:var(--sage);font-weight:600;}
  .store-notes{margin-top:.9rem;padding-top:.9rem;border-top:1px solid #EDE6DB;}
  .store-notes li{font-size:.78rem;color:var(--textMuted);margin-bottom:.35rem;list-style:none;padding-left:1.2em;position:relative;}
  .store-notes li::before{content:"※";position:absolute;left:0;}

  /* メニュー */
  .menu-cat{font-family:'Shippori Mincho B1',serif;font-size:1.15rem;font-weight:600;color:var(--greenDark);letter-spacing:.05em;margin:1.8rem 0 .9rem;padding-bottom:.5rem;border-bottom:1.5px solid var(--sage);}
  .menu-cat:first-child{margin-top:0;}
  .menu-card{border:1px solid #EDE6DB;border-radius:12px;margin-bottom:.9rem;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);}
  .menu-card.sel{border-color:var(--borderSel);background:var(--bgSelected);}
  .menu-head{padding:1rem 1.2rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .menu-thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;flex-shrink:0;}
  .menu-info{flex:1;min-width:0;}
  .menu-info h4{font-size:1rem;font-weight:700;color:var(--greenDark);margin-bottom:.3rem;}
  .menu-info .price{font-size:.88rem;color:var(--text);font-weight:600;}
  .menu-info .dur{font-size:.82rem;color:var(--textMuted);margin-right:.5rem;}
  .menu-select-btn{flex-shrink:0;padding:.4rem .9rem;border-radius:6px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .menu-card.sel .menu-select-btn{background:var(--green);color:#fff;}
  .menu-caret{flex-shrink:0;color:var(--sage);font-size:.85rem;align-self:center;}
  .menu-detail{padding:0 1rem 1rem;font-size:.8rem;color:var(--textSub);line-height:1.7;border-top:1px dashed var(--border);margin-top:0;padding-top:.8rem;}
  .menu-detail-img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-bottom:.7rem;display:block;}
  .menu-detail p{margin-bottom:.7rem;}
  .menu-detail-sec,.menu-detail-rec{margin-top:.7rem;}
  .menu-detail-rec{background:rgba(143,169,140,.13);border:1px solid rgba(143,169,140,.35);border-radius:8px;padding:.6rem .8rem;}
  .menu-detail-label{font-size:.7rem;font-weight:700;color:var(--green);margin-bottom:.3rem;letter-spacing:.03em;}
  .menu-detail-txt{font-size:.78rem;line-height:1.7;white-space:pre-wrap;}
  .menu-toggle{font-size:.72rem;color:var(--sage);cursor:pointer;padding:.3rem 1rem .7rem;font-weight:600;}

  /* フォーム */
  label.field{display:block;font-size:.82rem;font-weight:600;color:var(--green);margin-bottom:.45rem;letter-spacing:.03em;}
  label.field .req{color:var(--error);margin-left:2px;}
  input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{
    width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:6px;
    font-size:.9rem;color:var(--text);background:#FAFAF7;outline:none;box-sizing:border-box;
    font-family:'Noto Sans JP',sans-serif;}
  input:focus,select:focus,textarea:focus{border-color:var(--sage);}
  .field-group{margin-bottom:1.1rem;}
  .err-msg{font-size:.75rem;color:var(--error);margin-top:.3rem;}
  .row2{display:flex;gap:.8rem;}
  .row2>div{flex:1;min-width:0;}
  /* スマホ幅では日付・時間を縦に並べて、窮屈さ・はみ出し・重なりを防ぐ */
  @media (max-width:480px){
    .row2{flex-direction:column;gap:0;}
  }
  .agree{display:flex;align-items:flex-start;gap:.5rem;font-size:.8rem;color:var(--textSub);cursor:pointer;margin-bottom:1.1rem;}
  .agree input{width:18px;height:18px;margin-top:2px;flex-shrink:0;}
  .policy{background:var(--bgSub);border-radius:8px;padding:.9rem 1rem;font-size:.74rem;color:var(--textMuted);line-height:1.7;margin-bottom:1.2rem;}

  /* LINE連携バッジ */
  .line-badge{display:flex;align-items:center;gap:.5rem;background:#E8F5E9;border:1px solid #A5D6A7;border-radius:8px;padding:.7rem 1rem;margin-bottom:1.2rem;font-size:.8rem;color:#2E7D32;}
  .line-badge svg{flex-shrink:0;}

  /* ボタン */
  .btn{width:100%;padding:.95rem;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:var(--greenDark);}
  .btn-primary:disabled{background:var(--border);cursor:not-allowed;}
  .btn-ghost{background:#fff;color:var(--green);border:1.5px solid var(--border);margin-top:.7rem;}
  .btn-ghost:hover{background:var(--bgSub);}

  /* 選択中バナー */
  .selected-banner{background:var(--bgSelected);border:1px solid var(--borderSel);border-radius:12px;padding:1.1rem 1.4rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;}
  .selected-banner .lbl{color:var(--sage);font-size:.78rem;font-weight:600;margin-bottom:.2rem;}
  .selected-banner .val{color:var(--greenDark);font-weight:700;font-size:1rem;}
  .change-btn{background:#fff;border:1px solid var(--borderSel);border-radius:8px;padding:.5rem 1.1rem;color:var(--green);font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;}
  .change-btn:hover{background:var(--bgSub);}

  .loading,.empty{text-align:center;padding:2rem;color:var(--textMuted);font-size:.85rem;}

  /* 完了画面 */
  .done{text-align:center;padding:3rem 2rem;}
  .done .check{width:72px;height:72px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
  .done h2{font-family:'Shippori Mincho B1',serif;font-size:1.5rem;font-weight:700;color:var(--green);margin-bottom:1rem;}
  .done p{font-size:.88rem;color:var(--textSub);line-height:1.8;}
</style>
</head>
<body>

<!-- 固定ヘッダー（深緑バー） -->
<div class="topbar">
  <div class="logo-area">
    <img src="logomark_olive.png" alt="THE HERBS" />
    <div class="logo-text">
      <div class="sub">BOTANICAL BEAUTY</div>
      <div class="main">THE HERBS</div>
    </div>
  </div>
  <div class="formname">ご予約フォーム</div>
</div>

<div class="wrap" id="app">
  <div class="hero" id="hero">
    <div class="brand">RESERVATION</div>
    <h1>ご予約・お申し込み</h1>
  </div>
  <div id="content"><div class="loading">読み込み中…</div></div>
  <div id="mypage_link" style="text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);">
    <span style="font-size:.8rem;color:var(--textSub);">すでにご予約済みの方は</span><br>
    <a href="mypage.html" style="font-size:.88rem;color:var(--green);font-weight:700;text-decoration:underline;display:inline-block;margin-top:.4rem;">予約の確認・変更はこちら</a>
  </div>
</div>

<!-- フッター（深緑バー） -->
<div class="footer">
  <img src="logomark_olive.png" alt="" style="filter:brightness(0) invert(1);" />
  <div class="copy">© 2026 SCALP LABO / THE HERBS. All rights reserved.</div>
</div>

<!-- LIFF SDK（LINE連携用。?line= が無い通常ブラウザ閲覧でも読み込むだけで害はない） -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const API = 'https://herbs-booking-api.vercel.app/api/public-booking';

// ===== LINE連携（LIFF）=====
// URLの ?line=hankyu / ?line=honten で「どの公式アカウント経由か」を判定し、
// 対応するLIFFを初期化してお客様のLINEユーザーIDを取得する。
// ?line= が無い場合はLIFFを使わず、従来どおり（LINE紐付け無し→連絡はメール）。
const LIFF_IDS = {
  hankyu: '2009700937-rd2GBj8s', // 神戸阪急のLINEログインチャネルのLIFF
  honten: '2009766022-luxTH2VG', // 本店のLINEログインチャネルのLIFF
};
let lineChannel = '';   // 'hankyu' | 'honten' | ''（経由した公式アカウント）
let lineUserId = '';    // お客様のLINEユーザーID（取得できた場合のみ）

function getQuery(name){
  try { return new URLSearchParams(location.search).get(name) || ''; } catch(e){ return ''; }
}

// LIFFを初期化してLINEユーザーIDを取得する。失敗しても予約フローは止めない。
async function initLine(){
  const ch = getQuery('line'); // 'hankyu' | 'honten' | ''
  if (ch !== 'hankyu' && ch !== 'honten') return; // LINE経由でなければ何もしない
  lineChannel = ch;
  const liffId = LIFF_IDS[ch];
  if (!liffId || typeof liff === 'undefined') return;
  try {
    await liff.init({ liffId });
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      lineUserId = profile.userId || '';
    } else {
      // 外部ブラウザ等でログインしていない場合は、LINEログインへ誘導（戻り先は同じページ）
      liff.login({ redirectUri: location.href });
      return; // ログイン後にこのページが再読み込みされる
    }
  } catch (e) {
    console.warn('LIFF初期化に失敗:', e && e.message ? e.message : e);
    // 失敗してもメール運用にフォールバックするだけなので、予約は続行可能
  }
}

const C_STORES = [
  { value:'神戸阪急', label:'THE HERBS神戸阪急店', address:'神戸阪急本館6階 モーニングフロー内', hours:'10:00 〜 20:00', checkHours:'頭皮チェック受付：12:00 〜 16:00（随時受付も可）', phone:'070-2642-7366', lineUrl:'https://line.me/ti/p/@theherbs_kobe', lineName:'THE HERBS 神戸阪急', notes:[] },
  { value:'本店', label:'THE HERBS植物美容サロン', address:'兵庫県神戸市灘区大内通1-7-17 1F', hours:'水・金・土曜日 10:00〜20:00（不定期で月曜日）', checkHours:'完全予約制／クレジットカード決済のみ', phone:'070-2642-7366', lineUrl:'https://line.me/ti/p/@theherbs39', lineName:'THE HERBS サロン', notes:['初回はカウンセリングに約10分程度お時間をいただきます。','現金はご利用いただけません。クレジットカード決済のみとなります。','完全予約制です。お気軽にお問い合わせください。'] },
];
const TIME_HANKYU = ['12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00'];
const TIME_SALON = ['10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30'];
const CAT_ORDER = ['スカルプラボ','ベーシックケア','プレミアムパーソナルケア','セルフケア','フェイシャルケア','その他'];

let step='store', store='', menus=[], menuId='', menuName='', expanded='', lastBookingId='';
let form={ name:'',phone:'',email:'',birth:'',date:'',time:'',message:'',agree:false };
let errors={}, submitting=false;
let busyTimes=[]; // 選択日の埋まっている時間帯 [{start,end}]（分）
let busyLoading=false;

// 'HH:MM' → 分
function tMin(t){ const m=String(t||'').match(/(\d{1,2}):(\d{2})/); return m?parseInt(m[1])*60+parseInt(m[2]):null; }
// 選択中メニューの所要時間（分）。未選択や不明は60分
function selMenuDur(){ const m=menus.find(x=>x.id===menuId); return (m&&m.duration_min?m.duration_min:60); }
// ある開始時刻にメニューを入れたら既存予約と重なるか
function isSlotBusy(slotStr){
  const s=tMin(slotStr); if(s==null) return false;
  const e=s+selMenuDur()+30; // 所要時間＋30分
  return busyTimes.some(b=>s<b.end&&e>b.start); // 区間の重なり判定
}
// 指定日の埋まり時間を取得
async function loadBusyTimes(){
  if(!form.date||!store){ busyTimes=[]; return; }
  busyLoading=true;
  try{
    const d=await post('getBusyTimes',{store,date:form.date});
    busyTimes=d.busy||[];
  }catch(e){ busyTimes=[]; }
  busyLoading=false;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function post(action,extra={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||'エラー'); return d;
}
function minDate(){ const t=new Date(); t.setDate(t.getDate()+1); return t.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}); }

function stepsBar(){
  // 丸い番号のステップインジケーターは非表示。各画面の「STEP 1 — …」の文字ラベルで段階を示す。
  return '';
}

// LINE連携中の小さなバッジ（フォーム上部に表示）
function lineBadge(){
  if(!lineUserId) return '';
  return `<div class="line-badge">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#06C755"><path d="M12 2C6.48 2 2 5.64 2 10.12c0 4.02 3.55 7.39 8.35 8.03.32.07.77.21.88.49.1.25.07.64.03.89l-.14.85c-.04.25-.2.98.86.53 1.06-.45 5.7-3.36 7.78-5.75C21.05 13.5 22 11.92 22 10.12 22 5.64 17.52 2 12 2z"/></svg>
    LINEと連携済みです。ご予約の確認・変更・キャンセルのご連絡をLINEでお送りします。
  </div>`;
}

function render(){
  let h=stepsBar();
  if(step==='store') h+=renderStore();
  else if(step==='menu') h+=renderMenu();
  else if(step==='form') h+=renderForm();
  document.getElementById('content').innerHTML=h;
  if(step==='form') bindFormEvents();
}

function renderStore(){
  let h='<div class="step-label">STEP 1 — ご来店の店舗をお選びください</div>';
  C_STORES.forEach(s=>{
    h+=`<div class="store-card ${store===s.value?'sel':''}" onclick="selectStore('${s.value}')">
      <div class="store-card-arrow">›</div>
      <h3>${esc(s.label)}</h3>
      <div class="store-meta"><span class="lbl">住所</span>${esc(s.address)}</div>
      <div class="store-meta"><span class="lbl">営業</span>${esc(s.hours)}</div>
      <div class="store-meta"><span class="lbl">備考</span>${esc(s.checkHours)}</div>
      ${s.notes.length?`<ul class="store-notes">${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
    </div>`;
  });
  return h;
}

function selectStore(v){ store=v; step='menu'; loadMenus(); }

async function loadMenus(){
  document.getElementById('content').innerHTML=stepsBar()+'<div class="loading">メニューを読み込み中…</div>';
  try{
    const d=await post('listPublicMenus',{store});
    menus=d.menus||[];
    menus.sort((a,b)=>{
      const ai=CAT_ORDER.indexOf(a.category||''),bi=CAT_ORDER.indexOf(b.category||'');
      const ca=ai===-1?99:ai, cb=bi===-1?99:bi;
      if(ca!==cb)return ca-cb;
      return (a.sort_order||0)-(b.sort_order||0);
    });
    render();
  }catch(e){ document.getElementById('content').innerHTML=stepsBar()+`<div class="empty">${esc(e.message)}</div>`; }
}

function renderMenu(){
  const si=C_STORES.find(s=>s.value===store);
  let h=`<div class="selected-banner">
    <div><div class="lbl">選択中の店舗</div><div class="val">${esc(si.label)}</div></div>
    <button class="change-btn" onclick="backToStore()">変更</button>
  </div>
  <div class="step-label">STEP 2 — ご希望のメニューをお選びください</div>`;
  if(!menus.length){ h+='<div class="empty">現在表示できるメニューがありません</div>'; return h; }
  // カテゴリ別
  const groups={};
  menus.forEach(m=>{const c=m.category||'その他';(groups[c]=groups[c]||[]).push(m);});
  Object.entries(groups).forEach(([cat,items])=>{
    h+=`<div class="menu-cat">${esc(cat)}</div>`;
    items.forEach(m=>{
      const sel=menuId===m.id;
      const exp=expanded===m.id;
      const thumb=m.image_url?`<img class="menu-thumb" src="${esc(m.image_url)}" onerror="this.style.display='none';" alt="" />`:'';
      const hasDetail=m.description||m.treatment||m.recommendation||m.image_url;
      h+=`<div class="menu-card ${sel?'sel':''}">
        <div class="menu-head" onclick="toggleMenu('${esc(m.id)}')">
          ${thumb}
          <div class="menu-info">
            <h4>${esc(m.name)}</h4>
            <span class="price">${m.price>0?'¥'+Number(m.price).toLocaleString()+'（税込）':'税込'}</span>
            <span class="dur">${m.duration_min||'—'}分</span>
          </div>
          <span class="menu-caret">${exp?'▲':'▼'}</span>
        </div>
        ${exp?`<div class="menu-detail">
          ${m.image_url?`<img class="menu-detail-img" src="${esc(m.image_url)}" onerror="this.style.display='none';" alt="" />`:''}
          ${m.description?`<p>${esc(m.description)}</p>`:''}
          ${m.treatment?`<div class="menu-detail-sec"><div class="menu-detail-label">施術内容</div><div class="menu-detail-txt">${esc(m.treatment)}</div></div>`:''}
          ${m.recommendation?`<div class="menu-detail-rec"><div class="menu-detail-label">こんな方におすすめ</div><div class="menu-detail-txt">${esc(m.recommendation)}</div></div>`:''}
          <button class="btn btn-primary" style="margin-top:1rem;" onclick="selectMenu('${esc(m.id)}','${esc(m.name)}')">このメニューで予約する</button>
        </div>`:''}
      </div>`;
    });
  });
  h+='<button class="btn btn-ghost" onclick="backToStore()">← 店舗選択に戻る</button>';
  return h;
}

function toggleMenu(id){ expanded=expanded===id?'':id; render(); }
function selectMenu(id,name){ menuId=id; menuName=name; step='form'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function backToStore(){ step='store'; menuId=''; menuName=''; render(); }
function backToMenu(){ step='menu'; render(); }

// 時間の<select>のHTMLを生成（日付変更時に、この中身だけ差し替える）
function timeSelectHtml(slots){
  const opts = ['<option value="">' + (busyLoading?'空き状況を確認中…':'選択してください') + '</option>']
    .concat(slots.map(t=>{
      const busy=isSlotBusy(t);
      return `<option value="${t}"${form.time===t?' selected':''}${busy?' disabled':''}>${t}${busy?'（予約済）':''}</option>`;
    }));
  return `<select id="i_time">${opts.join('')}</select>`;
}

// 時間欄だけを再描画して、選択イベントを再接続する（画面全体は作り直さない）
function refreshTimeField(){
  const slots = store==='神戸阪急'?TIME_HANKYU:TIME_SALON;
  const wrap = document.getElementById('time_wrap');
  if(wrap){
    wrap.innerHTML = timeSelectHtml(slots);
    const t=document.getElementById('i_time');
    if(t) t.onchange=e=>{ form.time=e.target.value; const te=document.getElementById('time_err'); if(te) te.innerHTML=''; };
  }
}

// フォーム入力欄にイベントを接続（描画後に呼ぶ）
function bindFormEvents(){
  const n=document.getElementById('i_name'); if(n) n.oninput=e=>{form.name=e.target.value;};
  const p=document.getElementById('i_phone'); if(p) p.oninput=e=>{form.phone=e.target.value;};
  const em=document.getElementById('i_email'); if(em) em.oninput=e=>{form.email=e.target.value;};
  const bd=document.getElementById('i_birth'); if(bd) bd.oninput=e=>{form.birth=e.target.value;};
  const d=document.getElementById('i_date'); if(d) d.onchange=async e=>{
    const v=e.target.value;
    const dateErr=document.getElementById('date_err');
    // 本店は木曜・日曜が休み
    if(v&&store==='本店'){
      const wd=new Date(v+'T00:00:00+09:00').getDay(); // 0=日,4=木
      if(wd===0||wd===4){
        form.date=''; form.time=''; busyTimes=[];
        if(dateErr) dateErr.innerHTML='<div class="err-msg">本店は木曜・日曜はお休みです。別の日をお選びください。</div>';
        refreshTimeField();
        return;
      }
    }
    form.date=v; form.time=''; errors.date='';
    if(dateErr) dateErr.innerHTML='';
    // 「確認中…」を表示してから空き状況を取得し、時間欄だけ差し替える（画面全体は作り直さない＝カレンダーが閉じない）
    busyLoading=true; refreshTimeField();
    await loadBusyTimes();
    busyLoading=false; refreshTimeField();
  };
  const t=document.getElementById('i_time'); if(t) t.onchange=e=>{ form.time=e.target.value; const te=document.getElementById('time_err'); if(te) te.innerHTML=''; };
  const msg=document.getElementById('i_msg'); if(msg) msg.oninput=e=>{form.message=e.target.value;};
  const ag=document.getElementById('i_agree'); if(ag) ag.onchange=e=>{form.agree=e.target.checked;};
  const sb=document.getElementById('b_submit'); if(sb) sb.onclick=submitBooking;
  const bk=document.getElementById('b_back'); if(bk) bk.onclick=backToMenu;
}

function validate(){
  errors={};
  if(!form.name.trim()) errors.name='お名前を入力してください';
  if(!form.phone.trim()) errors.phone='電話番号を入力してください';
  else if(!/^[\d\-\+\(\)\s]{7,20}$/.test(form.phone.trim())) errors.phone='正しい電話番号を入力してください';
  if(!form.date) errors.date='ご希望日を選択してください';
  if(!form.time) errors.time='ご希望時間を選択してください';
  if(!form.agree) errors.agree='キャンセルポリシーへの同意が必要です';
  return Object.keys(errors).length===0;
}

async function submitBooking(){
  if(!validate()){ render(); return; }
  submitting=true; render();
  try{
    const d=await post('createReservation',{
      store, menu_id:menuId, menu_name:menuName,
      name:form.name.trim(), phone:form.phone.trim(),
      email:form.email.trim()||null,
      birth_date:form.birth||null,
      desired_date:form.date, desired_time:form.time,
      gender:'女性', notes:form.message.trim()||null,
      // LINE連携情報（取得できた場合のみ送る。無ければ従来どおりメール運用）
      line_user_id: lineUserId || null,
      line_channel: lineChannel || null,
    });
    lastBookingId=d.id||'';
    renderDone();
  }catch(e){
    submitting=false; errors.submit=e.message; render();
  }
}

        <a href="${si.lineUrl}" target="_blank" rel="noopener"
           style="display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;padding:.85rem;background:#06C755;color:#fff;border-radius:8px;font-size:.9rem;font-weight:700;text-decoration:none;white-space:nowrap;">

        <p style="font-size:.72rem;color:var(--textMuted);line-height:1.6;margin-top:.9rem;">
          ※ キャンセルは3日前まで無料、2日前以降は施術料金の100%を申し受けます。<br>
          ※ お電話でも承ります：${esc(si.phone)}
