<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>お誕生日のお客様 — THE HERBS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{--ink:#544739;--muted:#766A5B;--paper:#FFFCF7;--surface:#FFFFFF;--deep:#544739;--green:#859A93;--green-hi:#6E847C;--sage:#A9BBB5;--line:#EBE5DB;--warm:#FAF6EF;--amber:#B5783A;--red:#B5483A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.5;}
  .hd{background:var(--deep);color:#EFEAE0;padding:10px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .store-badge{font-size:11px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px;}
  .wrap{padding:12px 16px;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);}
  .chip.on{background:var(--deep);color:#fff;border-color:var(--deep);}
  .ml{margin-left:auto;}

  .month-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .mn-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--warm);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;}
  .mn-title{font-size:16px;font-weight:700;min-width:120px;text-align:center;}
  .mn-today{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);cursor:pointer;}

  .summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sm-card{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .sm-num{font-size:20px;font-weight:700;color:var(--deep);}
  .sm-lbl{font-size:11px;color:var(--muted);font-weight:700;}

  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead tr{border-bottom:2px solid var(--line);}
  th{padding:8px 10px;text-align:left;font-weight:700;color:var(--muted);white-space:nowrap;}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:hover{background:var(--warm);}
  td{padding:8px 10px;vertical-align:middle;}
  .td-name{font-size:13px;font-weight:700;}
  .td-bd{font-weight:700;white-space:nowrap;color:var(--green-hi);}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700;white-space:nowrap;}
  .b-ok{background:#EAF3E6;color:#3D7A4A;}
  .b-web{background:#E7EEFB;color:#3B62B0;border:1px solid #C2D2F0;}
  .b-tel{background:#EFEAE0;color:#8a8275;}
  .b-store{background:#F3EEDB;color:#8A7320;border:1px solid #E0D29A;}
  .cust-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:7px;font-weight:700;background:#EAF0F2;color:#3A6577;border:1px solid #B8D0DA;text-decoration:none;}
  .today-bd td:first-child{border-left:3px solid var(--amber);}

  .empty{text-align:center;padding:32px;color:var(--muted);}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 18px;border-radius:18px;font-size:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="apple-mobile-web-app-title" content="お誕生日" />
</head>

<body>

<!-- ログイン画面 -->
<div id="loginView" style="position:fixed;inset:0;background:#544739;color:#EFEAE0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:300;">
  <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;letter-spacing:3px;margin-bottom:6px;">THE HERBS</div>
  <div style="font-size:13px;color:#A9BBB5;font-weight:700;margin-bottom:20px;">お誕生日のお客様</div>
  <div style="font-size:13px;color:#D8D0C4;margin-bottom:14px;">パスワードを入力してください</div>
  <input id="loginPw" type="password" autocomplete="current-password" placeholder="パスワード" style="width:min(280px,80vw);padding:11px 13px;border:none;border-radius:9px;font-size:15px;margin-bottom:10px;" />
  <div id="loginErr" style="color:#F2B8B0;font-size:13px;min-height:18px;margin-bottom:8px;font-weight:700;"></div>
  <button id="loginBtn" style="width:min(280px,80vw);padding:12px;background:#6E847C;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">ログイン</button>
</div>

<div class="hd">
  お誕生日のお客様
  <span class="store-badge" id="storeBadge">全店舗</span>
  <button onclick="doLogout()" style="margin-left:auto;font-size:12px;font-weight:700;color:#EFEAE0;background:rgba(255,255,255,.16);border:none;border-radius:7px;padding:5px 11px;cursor:pointer;font-family:inherit;">ログアウト</button>
</div>

<div class="wrap">
  <!-- 月ナビ -->
  <div class="month-nav">
    <button class="mn-btn" id="mPrev">‹</button>
    <div class="mn-title" id="mTitle">—</div>
    <button class="mn-btn" id="mNext">›</button>
    <button class="mn-today" id="mToday">今月</button>
  </div>

  <!-- 店舗絞り込み -->
  <div class="toolbar">
    <div class="chips" id="storeChips">
      <span class="chip on" data-s="all">全店舗</span>
      <span class="chip" data-s="30002">神戸阪急</span>
      <span class="chip" data-s="60001">本店</span>
    </div>
  </div>

  <!-- 集計 -->
  <div class="summary" id="summary"></div>

  <!-- 一覧 -->
  <div class="tbl-wrap" id="listView">
    <div class="empty">読み込み中…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_APP='https://theherbs-store-git-main-yumiko-s-projects.vercel.app';
// 予約・顧客の取得は、パスワード認証済みのサーバーAPI経由（RLSに守られた顧客台帳を安全に読む）
const API='https://herbs-booking-api.vercel.app/api/store';

let PW = sessionStorage.getItem('resv_pw') || '';
let ALL=[];              // 現在の月で取得済みの誕生日顧客
let VIEW_MONTH=new Date().getMonth()+1; // 表示中の月（1〜12）
let STORE_F='all';
let LOAD_TOKEN=0;       // 月切り替えの取得競合を防ぐための番号

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function todayJST(){return new Date().toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');}

// birthDate(YYYY-MM-DD) から 月・日・年齢 を取り出す
function parseBD(bd){
  const m=String(bd||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return null;
  const y=Number(m[1]), mo=Number(m[2]), d=Number(m[3]);
  const now=new Date();
  let age=now.getFullYear()-y;
  const mm=now.getMonth()+1, dd=now.getDate();
  if(mo>mm || (mo===mm && d>dd)) age--; // 今年まだ誕生日が来ていなければ1引く
  return { year:y, month:mo, day:d, age };
}

// サーバーAPIを叩く共通関数
async function post(action, extra={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PW,action,...extra})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||'エラー'); return d;
}

// 指定した月の誕生日顧客を、サーバー経由で取得（RLSに守られた台帳を安全に読む）
async function loadMonth(month){
  const d=await post('listBirthdayCustomers',{ month });
  return d.customers||[];
}

// 連絡手段バッジ
function contactBadge(c){
  if(c.line_user_id) return '<span class="badge b-ok" title="LINEで連絡できます">LINE</span>';
  if(c.email) return '<span class="badge b-web" title="メールで連絡できます">メール</span>';
  return '<span class="badge b-tel" title="電話で連絡してください">電話のみ</span>';
}
function storeName(sid){ if(String(sid)==='30002')return'神戸阪急'; if(String(sid)==='60001')return'本店'; return sid?('店舗'+sid):'—'; }

function render(){
  document.getElementById('mTitle').textContent=`${VIEW_MONTH}月`;
  // ALL は「表示中の月」の誕生日顧客（サーバーで月絞り済み）。ここでは店舗で絞る。
  let list=ALL.slice();
  if(STORE_F!=='all') list=list.filter(c=>String(c.salonId)===STORE_F);
  // 誕生日の日付順
  list.sort((a,b)=>{ const ba=parseBD(a.birthDate), bb=parseBD(b.birthDate); return (ba?ba.day:99)-(bb?bb.day:99); });

  // 集計
  const total=list.length;
  const mailCnt=list.filter(c=>!c.line_user_id && c.email).length;
  const lineCnt=list.filter(c=>c.line_user_id).length;
  const telCnt=total-mailCnt-lineCnt;
  document.getElementById('summary').innerHTML=
    `<div class="sm-card"><div class="sm-num">${total}</div><div class="sm-lbl">${VIEW_MONTH}月生まれ</div></div>`+
    `<div class="sm-card"><div class="sm-num">${lineCnt}</div><div class="sm-lbl">LINEで送れる</div></div>`+
    `<div class="sm-card"><div class="sm-num">${mailCnt}</div><div class="sm-lbl">メールで送れる</div></div>`+
    `<div class="sm-card"><div class="sm-num">${telCnt}</div><div class="sm-lbl">電話のみ</div></div>`;

  if(!list.length){ document.getElementById('listView').innerHTML='<div class="empty">この月がお誕生日のお客様はいません</div>'; return; }

  const today=todayJST(); // YYYY-MM-DD
  const todayMD=today.slice(5); // MM-DD
  let h=`<table><thead><tr><th>お誕生日</th><th>お名前</th><th>年齢</th><th>連絡手段</th><th>電話</th><th>店舗</th><th>最終来店</th><th></th></tr></thead><tbody>`;
  list.forEach(c=>{
    const b=parseBD(c.birthDate);
    const md=`${String(b.month).padStart(2,'0')}-${String(b.day).padStart(2,'0')}`;
    const isTodayBd=(md===todayMD);
    const hist=`<a class="cust-tag" href="${STORE_APP}/customer-history-live.html?customerId=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">履歴 ↗</a>`;
    h+=`<tr class="${isTodayBd?'today-bd':''}">
      <td class="td-bd">${b.month}月${b.day}日${isTodayBd?' <span class="badge b-store">本日</span>':''}</td>
      <td class="td-name">${esc(c.name||'（無名）')}${c.nameKana?`<br><span style="font-size:10px;color:var(--muted);font-weight:400;">${esc(c.nameKana)}</span>`:''}</td>
      <td>${b.age!=null?b.age+'歳':'—'}</td>
      <td>${contactBadge(c)}</td>
      <td>${esc(c.phone||'—')}${c.email?`<br><span style="font-size:10px;color:var(--muted);">${esc(c.email)}</span>`:''}</td>
      <td>${esc(storeName(c.salonId))}</td>
      <td style="white-space:nowrap;">${esc(c.lastVisitDate||'—')}</td>
      <td>${hist}</td>
    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('listView').innerHTML=h;
}

// 指定月を読み込んで表示（取得中は「読み込み中」を出し、競合を防ぐ）
async function showMonth(month){
  VIEW_MONTH=month;
  document.getElementById('mTitle').textContent=`${VIEW_MONTH}月`;
  document.getElementById('listView').innerHTML='<div class="empty">読み込み中…</div>';
  document.getElementById('summary').innerHTML='';
  const token=++LOAD_TOKEN;
  try{
    const rows=await loadMonth(month);
    if(token!==LOAD_TOKEN) return; // 途中で月が変わっていたら破棄
    ALL=rows; render();
  }catch(e){
    if(token!==LOAD_TOKEN) return;
    document.getElementById('listView').innerHTML=`<div class="empty">読み込みに失敗しました：${esc(e.message)}</div>`;
  }
}

// 月ナビ
document.getElementById('mPrev').onclick=()=>{ let m=VIEW_MONTH-1; if(m<1)m=12; showMonth(m); };
document.getElementById('mNext').onclick=()=>{ let m=VIEW_MONTH+1; if(m>12)m=1; showMonth(m); };
document.getElementById('mToday').onclick=()=>{ showMonth(new Date().getMonth()+1); };

// 店舗絞り込み
document.getElementById('storeChips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  document.querySelectorAll('#storeChips .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); STORE_F=c.dataset.s;
  document.getElementById('storeBadge').textContent=(STORE_F==='all'?'全店舗':storeName(STORE_F));
  render();
});

// ===== データ読み込み =====
async function load(){
  await showMonth(VIEW_MONTH);
}

// ===== ログイン（既存の店舗APIでパスワード検証）=====
function showLogin(msg){ document.getElementById('loginView').style.display='flex'; document.getElementById('loginErr').textContent=msg||''; }
function hideLogin(){ document.getElementById('loginView').style.display='none'; }
async function verifyPw(pw){
  // 誕生日取得APIに軽く投げて、パスワードが通るか確認する
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,action:'listBirthdayCustomers',month:new Date().getMonth()+1})});
  if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||'認証エラー'); }
  return true;
}
async function doLogin(){
  const pw=(document.getElementById('loginPw').value||'').trim();
  if(!pw){ document.getElementById('loginErr').textContent='パスワードを入力してください'; return; }
  document.getElementById('loginErr').textContent='確認中…';
  try{
    await verifyPw(pw);
    PW=pw; sessionStorage.setItem('resv_pw',PW);
    document.getElementById('loginPw').value='';
    hideLogin();
    await load();
  }catch(e){
    PW=''; sessionStorage.removeItem('resv_pw');
    document.getElementById('loginErr').textContent=(/認証|パスワード/.test(e.message)?'パスワードが違います':e.message);
  }
}
function doLogout(){
  PW=''; sessionStorage.removeItem('resv_pw');
  ALL=[]; document.getElementById('listView').innerHTML='<div class="empty">—</div>';
  document.getElementById('summary').innerHTML='';
  showLogin('ログアウトしました');
}

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });

// 起動：保存済みパスワードがあれば自動ログイン
document.getElementById('mTitle').textContent=`${VIEW_MONTH}月`;
if(PW){ verifyPw(PW).then(()=>{ hideLogin(); return load(); }).catch(()=>{ PW=''; sessionStorage.removeItem('resv_pw'); showLogin(); }); }
else { showLogin(); }
</script>
</body>
</html>
