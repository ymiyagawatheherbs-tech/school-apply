<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>日報ボード — THE HERBS</title>
<style>
  :root{--ink:#544739;--muted:#766A5B;--paper:#FFFCF7;--surface:#FFFFFF;--deep:#544739;--green:#859A93;--green-hi:#6E847C;--sage:#A9BBB5;--line:#EBE5DB;--warm:#FAF6EF;--amber:#B5783A;--red:#B5483A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased;font-weight:500;}
  .num{font-variant-numeric:tabular-nums;}
  .hd{background:var(--deep);color:#F3F1E9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:56px;position:sticky;top:0;z-index:20;}
  .logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:3px;cursor:pointer;}
  .hd-r{display:flex;align-items:center;gap:10px;}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#F3F1E9;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;}
  .mini{background:transparent;border:none;color:var(--sage);font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline;}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 80px;}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filt{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:8px 15px;border:1px solid var(--line);background:var(--surface);border-radius:20px;font-family:inherit;font-size:13.5px;color:var(--ink);font-weight:600;cursor:pointer;}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;box-shadow:0 1px 4px rgba(133,154,147,.4);}
  .refresh{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 5px rgba(84,71,57,.05);}
  .card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line);background:var(--warm);}
  .card-date{font-size:15px;font-weight:800;color:var(--deep);}
  .card-salon{font-size:11.5px;font-weight:700;color:#fff;background:var(--green);padding:3px 9px;border-radius:6px;}
  .card-salon.hankyu{background:var(--amber);}
  .memo{padding:16px 17px;}
  .memo-head{font-size:14px;font-weight:800;color:var(--green-hi);margin-bottom:9px;letter-spacing:.5px;}
  .memo-body{font-size:15.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .react{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 17px;border-top:1px solid var(--line);}
  .react-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-family:inherit;font-size:14px;cursor:pointer;line-height:1;transition:border-color .1s,background .1s;}
  .react-btn:hover{border-color:var(--sage);}
  .react-btn.on{background:rgba(133,154,147,.16);border-color:var(--green);font-weight:700;}
  .react-btn .cnt{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}
  .react-btn.on .cnt{color:var(--green-hi);}
  .cmts{border-top:1px solid var(--line);padding:13px 17px;background:var(--paper);}
  .cmt{margin-bottom:11px;}
  .cmt-meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
  .cmt-meta b{color:var(--deep);font-weight:700;font-size:12.5px;}
  .cmt-body{font-size:14px;line-height:1.65;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;}
  .cmt-empty{font-size:12.5px;color:var(--muted);padding:2px 0 10px;}
  .cmt-form{display:flex;gap:8px;align-items:flex-end;margin-top:4px;}
  .cmt-form textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;line-height:1.6;outline:none;resize:vertical;min-height:42px;background:var(--surface);}
  .cmt-form textarea:focus{border-color:var(--green);}
  .cmt-send{border:none;border-radius:10px;background:var(--green);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;padding:0 16px;height:42px;cursor:pointer;white-space:nowrap;}
  .cmt-send:disabled{background:#C4C9C2;cursor:not-allowed;}
  .more{display:block;width:100%;max-width:280px;margin:8px auto 0;padding:13px;border:1px solid var(--line);background:var(--surface);border-radius:11px;font-family:inherit;font-size:14px;font-weight:600;color:var(--deep);cursor:pointer;}
  .empty{text-align:center;color:var(--muted);padding:60px 24px;font-size:14px;line-height:1.8;}
  .loading{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--muted);font-size:14px;}
  .err{background:rgba(181,72,58,.1);color:var(--red);border:1px solid rgba(181,72,58,.3);border-radius:9px;padding:11px 13px;font-size:12.5px;margin:0 0 14px;line-height:1.6;}
  .setup{max-width:520px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;}
  .setup h2{font-size:18px;margin-bottom:8px;}
  .setup p{font-size:13px;color:var(--muted);line-height:1.7;}
  .setup a{color:var(--green-hi);font-weight:700;}
  @media (max-width:600px){.hd{padding:8px 12px;}.logo{font-size:20px;}.wrap{padding:14px 12px 70px;}.memo-body{font-size:15px;}}
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.SUPABASE_URL = "https://bpogujxrwdpzkfisscox.supabase.co";
  window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwb2d1anhyd2RwemtmaXNzY294Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1OTQ0NjEsImV4cCI6MjA5NzE3MDQ2MX0.b39pjEYrTbS_U49Ud5GTEHh_luveh5wkZdtnWJN2x0M";
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// 反応に使う絵文字（ここを編集すれば増減できます）
const EMOJIS = ["👍", "✅", "👀", "🙏", "❤️"];
const PAGE = 30;

const STAFF_KEY = "scalp_staff";
const LOCK_MS = 5 * 60 * 1000;
function getStoredStaff() { try { const s = JSON.parse(localStorage.getItem(STAFF_KEY)); if (s && Date.now() - s.at < LOCK_MS) return s; } catch (e) {} return null; }
function touchStaff() { const s = getStoredStaff(); if (s) { s.at = Date.now(); localStorage.setItem(STAFF_KEY, JSON.stringify(s)); } }
function clearStaff() { localStorage.removeItem(STAFF_KEY); }
function goMenu() { if (window.self !== window.top) return; location.replace("index.html"); }

const WD = ["日", "月", "火", "水", "木", "金", "土"];
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(String(d).slice(0, 10) + "T00:00:00+09:00");
  if (isNaN(dt)) return String(d);
  return dt.getFullYear() + "/" + String(dt.getMonth() + 1).padStart(2, "0") + "/" + String(dt.getDate()).padStart(2, "0") + "（" + WD[dt.getDay()] + "）";
}
function fmtTime(t) {
  const dt = new Date(t);
  if (isNaN(dt)) return "";
  return (dt.getMonth() + 1) + "/" + dt.getDate() + " " + String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0");
}
// メモ先頭行（担当者・天気）を見出しに、残りを本文に分ける
function splitMemo(memo) {
  const lines = String(memo || "").split("\n");
  let i = 0; while (i < lines.length && !lines[i].trim()) i++;
  const head = (lines[i] || "").trim();
  let body = lines.slice(i + 1).join("\n").replace(/^\s*\n+/, "");
  return { head, body };
}

function App() {
  const [client, setClient] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [session, setSession] = useState(null);

  const [salons, setSalons] = useState([]);
  const [salonFilter, setSalonFilter] = useState("all");
  const [reports, setReports] = useState([]);
  const [commentsBy, setCommentsBy] = useState({});
  const [reactionsBy, setReactionsBy] = useState({});
  const [hasMore, setHasMore] = useState(false);
  const [drafts, setDrafts] = useState({});
  const [posting, setPosting] = useState({});

  const stored = getStoredStaff();
  const currentStaff = stored ? { id: stored.id, displayName: stored.name } : null;

  useEffect(() => {
    const u = window.SUPABASE_URL, k = window.SUPABASE_ANON_KEY;
    if (u && k) connect(u, k); else setLoading(false);
  }, []);

  useEffect(() => {
    if (!currentStaff) return;
    const bump = () => touchStaff();
    window.addEventListener("mousedown", bump);
    window.addEventListener("keydown", bump);
    window.addEventListener("touchstart", bump);
    const iv = setInterval(() => { if (!getStoredStaff()) goMenu(); }, 10000);
    return () => { window.removeEventListener("mousedown", bump); window.removeEventListener("keydown", bump); window.removeEventListener("touchstart", bump); clearInterval(iv); };
  }, [currentStaff && currentStaff.id]);

  async function connect(u, k) {
    setLoading(true); setErr("");
    try {
      const c = supabase.createClient(u, k);
      setClient(c);
      const { data: { session: sess } } = await c.auth.getSession();
      if (sess) { setSession(sess); await afterAuth(c); } else { goMenu(); setLoading(false); }
    } catch (e) { setErr("接続エラー：" + (e.message || e)); setLoading(false); }
  }

  async function afterAuth(c) {
    setLoading(true); setErr("");
    try {
      if (!getStoredStaff()) { goMenu(); return; }
      const sal = await c.from("salons").select("id,name");
      if (sal.error) throw sal.error;
      setSalons(sal.data || []);
      await loadReports(c, "all", true);
      setLoading(false);
    } catch (e) { setErr("データ取得エラー：" + (e.message || e)); setLoading(false); }
  }

  async function loadReports(c, filter, reset) {
    const from = reset ? 0 : reports.length;
    const to = from + PAGE - 1;
    let q = c.from("daily_reports")
      .select('id, "salonId", report_date, memo, updated_at')
      .order("report_date", { ascending: false })
      .order("id", { ascending: false })
      .range(from, to);
    if (filter !== "all") q = q.eq("salonId", String(filter));
    const { data: reps, error } = await q;
    if (error) throw error;
    const batch = (reps || []).filter((r) => r.memo && String(r.memo).trim());
    const ids = batch.map((r) => r.id);
    const cmap = {}, rmap = {};
    if (ids.length) {
      const [cm, rx] = await Promise.all([
        c.from("daily_report_comments").select('id, "reportId", "authorName", body, "createdAt"').in("reportId", ids).order("createdAt", { ascending: true }),
        c.from("daily_report_reactions").select('id, "reportId", "userName", emoji').in("reportId", ids),
      ]);
      (cm.data || []).forEach((x) => { (cmap[x.reportId] = cmap[x.reportId] || []).push(x); });
      (rx.data || []).forEach((x) => { (rmap[x.reportId] = rmap[x.reportId] || []).push(x); });
    }
    if (reset) { setReports(batch); setCommentsBy(cmap); setReactionsBy(rmap); }
    else { setReports((p) => [...p, ...batch]); setCommentsBy((p) => ({ ...p, ...cmap })); setReactionsBy((p) => ({ ...p, ...rmap })); }
    setHasMore((reps || []).length === PAGE);
  }

  async function changeFilter(f) {
    setSalonFilter(f); setErr("");
    try { await loadReports(client, f, true); } catch (e) { setErr("読み込みエラー：" + (e.message || e)); }
  }

  async function loadMore() {
    try { await loadReports(client, salonFilter, false); } catch (e) { setErr("読み込みエラー：" + (e.message || e)); }
  }

  async function refreshOne(reportId) {
    const [cm, rx] = await Promise.all([
      client.from("daily_report_comments").select('id, "reportId", "authorName", body, "createdAt"').eq("reportId", reportId).order("createdAt", { ascending: true }),
      client.from("daily_report_reactions").select('id, "reportId", "userName", emoji').eq("reportId", reportId),
    ]);
    setCommentsBy((p) => ({ ...p, [reportId]: cm.data || [] }));
    setReactionsBy((p) => ({ ...p, [reportId]: rx.data || [] }));
  }

  async function toggleReaction(reportId, emoji) {
    if (!currentStaff) return;
    const me = currentStaff.displayName;
    const list = reactionsBy[reportId] || [];
    const mine = list.find((r) => r.userName === me && r.emoji === emoji);
    try {
      if (mine) { const r = await client.from("daily_report_reactions").delete().eq("id", mine.id); if (r.error) throw r.error; }
      else { const r = await client.from("daily_report_reactions").insert({ reportId, userName: me, emoji }); if (r.error) throw r.error; }
      await refreshOne(reportId);
    } catch (e) { setErr("リアクションエラー：" + (e.message || e)); }
  }

  async function addComment(reportId) {
    if (!currentStaff) return;
    const body = (drafts[reportId] || "").trim();
    if (!body) return;
    setPosting((p) => ({ ...p, [reportId]: true }));
    try {
      const r = await client.from("daily_report_comments").insert({ reportId, authorName: currentStaff.displayName, body });
      if (r.error) throw r.error;
      setDrafts((p) => ({ ...p, [reportId]: "" }));
      await refreshOne(reportId);
    } catch (e) { setErr("コメント投稿エラー：" + (e.message || e)); }
    setPosting((p) => ({ ...p, [reportId]: false }));
  }

  const salonName = (sid) => {
    const s = salons.find((x) => String(x.id) === String(sid));
    return s ? s.name : (sid != null ? String(sid) : "—");
  };

  if (loading) return <div className="loading">読み込み中…</div>;

  if (!session || !currentStaff) {
    return (
      <div className="setup">
        <h2>メニューに戻ります</h2>
        <p>このまま切り替わらない場合は、<a href="index.html">メニューを開く</a>を押してください。</p>
        {err && <div className="err" style={{ marginTop: 14 }}>{err}</div>}
      </div>
    );
  }

  return (
    <React.Fragment>
      <div className="hd">
        <span className="logo" onClick={goMenu} title="メニューに戻る">THE HERBS</span>
        <div className="hd-r">
          <span className="pill">担当 <b style={{ margin: "0 2px" }}>{currentStaff.displayName}</b></span>
          <button className="mini" onClick={() => { clearStaff(); goMenu(); }}>ロック</button>
        </div>
      </div>

      <div className="wrap">
        {err && <div className="err">{err}</div>}

        <div className="toolbar">
          <div className="filt">
            <button className={"chip" + (salonFilter === "all" ? " on" : "")} onClick={() => changeFilter("all")}>全店</button>
            {salons.map((s) => (
              <button key={s.id} className={"chip" + (String(salonFilter) === String(s.id) ? " on" : "")} onClick={() => changeFilter(s.id)}>{s.name}</button>
            ))}
          </div>
          <button className="refresh" onClick={() => changeFilter(salonFilter)}>更新</button>
        </div>

        {reports.length === 0
          ? <div className="empty">日報がまだありません。</div>
          : reports.map((r) => {
            const { head, body } = splitMemo(r.memo);
            const rx = reactionsBy[r.id] || [];
            const cm = commentsBy[r.id] || [];
            const me = currentStaff.displayName;
            const isHankyu = salonName(r.salonId).includes("阪急");
            return (
              <div key={r.id} className="card">
                <div className="card-hd">
                  <span className="card-date num">{fmtDate(r.report_date)}</span>
                  <span className={"card-salon" + (isHankyu ? " hankyu" : "")}>{salonName(r.salonId)}</span>
                </div>
                <div className="memo">
                  {head && <div className="memo-head">{head}</div>}
                  {body && <div className="memo-body">{body}</div>}
                  {!body && !head && <div className="memo-body" style={{ color: "var(--muted)" }}>（メモなし）</div>}
                </div>

                <div className="react">
                  {EMOJIS.map((em) => {
                    const users = rx.filter((x) => x.emoji === em).map((x) => x.userName);
                    const on = users.indexOf(me) >= 0;
                    return (
                      <button key={em} className={"react-btn" + (on ? " on" : "")} title={users.length ? users.join("、") : "リアクション"} onClick={() => toggleReaction(r.id, em)}>
                        <span>{em}</span>{users.length > 0 && <span className="cnt">{users.length}</span>}
                      </button>
                    );
                  })}
                </div>

                <div className="cmts">
                  {cm.length === 0
                    ? <div className="cmt-empty">コメントはまだありません</div>
                    : cm.map((c) => (
                      <div key={c.id} className="cmt">
                        <div className="cmt-meta"><b>{c.authorName}</b> ・ {fmtTime(c.createdAt)}</div>
                        <div className="cmt-body">{c.body}</div>
                      </div>
                    ))}
                  <div className="cmt-form">
                    <textarea placeholder="コメントを書く…" value={drafts[r.id] || ""} onChange={(e) => setDrafts((p) => ({ ...p, [r.id]: e.target.value }))} />
                    <button className="cmt-send" disabled={posting[r.id] || !(drafts[r.id] || "").trim()} onClick={() => addComment(r.id)}>{posting[r.id] ? "送信中" : "送信"}</button>
                  </div>
                </div>
              </div>
            );
          })}

        {hasMore && <button className="more" onClick={loadMore}>もっと読む</button>}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
