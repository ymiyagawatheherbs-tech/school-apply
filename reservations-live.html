<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>予約管理 — THE HERBS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root{--ink:#544739;--muted:#766A5B;--paper:#FFFCF7;--surface:#FFFFFF;--deep:#544739;--green:#859A93;--green-hi:#6E847C;--sage:#A9BBB5;--line:#EBE5DB;--warm:#FAF6EF;--amber:#B5783A;--red:#B5483A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.5;}
  .hd{background:var(--deep);color:#EFEAE0;padding:10px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .store-badge{font-size:11px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px;}
  .wrap{padding:12px 16px;}

  /* ツールバー */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .chips{display:flex;gap:5px;}
  .chip{padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);}
  .chip.on{background:var(--deep);color:#fff;border-color:var(--deep);}
  .ml{margin-left:auto;}
  .btn{padding:7px 14px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--deep);color:#fff;}
  .btn-ghost{background:var(--warm);border:1px solid var(--line);color:var(--ink);}

  /* フォーム */
  .form-card{background:var(--surface);border:1px solid var(--green);border-radius:10px;padding:14px;margin-bottom:12px;display:none;}
  .form-card.open{display:block;}
  .form-card h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--deep);}
  .frow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .fg{flex:1;min-width:130px;display:flex;flex-direction:column;gap:3px;}
  .fg label{font-size:11px;font-weight:700;color:var(--muted);}
  .fg input,.fg select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px;background:var(--warm);outline:none;}
  .fg input:focus,.fg select:focus{border-color:var(--green);background:#fff;}
  .form-actions{display:flex;gap:7px;margin-top:10px;}

  /* テーブル */
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead tr{border-bottom:2px solid var(--line);}
  th{padding:8px 10px;text-align:left;font-weight:700;color:var(--muted);white-space:nowrap;}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:hover{background:var(--warm);}
  td{padding:8px 10px;vertical-align:middle;}
  .td-name{font-size:13px;font-weight:700;}
  .td-menu{color:var(--muted);}
  .td-time{font-weight:700;white-space:nowrap;}
  .td-today{color:var(--green-hi);font-weight:700;}
  .status-sel{font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:white;font-family:inherit;cursor:pointer;}
  .btn-del{padding:4px 9px;font-size:11px;border-radius:6px;border:1px solid #F0C8C4;background:#FBEAE7;color:var(--red);cursor:pointer;font-family:inherit;font-weight:700;}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700;white-space:nowrap;}
  .b-new{background:#FBE9D6;color:#C26A12;border:1px solid #F0C089;}
  .b-ok{background:#EAF3E6;color:#3D7A4A;}
  .b-hold{background:#F3EEDB;color:#8A7320;border:1px solid #E0D29A;}
  .b-ng{background:#FBEAE7;color:var(--red);}
  .b-web{background:#E7EEFB;color:#3B62B0;border:1px solid #C2D2F0;}
  .b-tel{background:#E3F1EE;color:#2E776C;border:1px solid #BFE0D8;}
  .b-walk{background:#FBEEDF;color:#B5702A;border:1px solid #F0CFA6;}
  .btn-edit{padding:4px 9px;font-size:11px;border-radius:6px;border:1px solid var(--line);background:var(--warm);color:var(--ink);cursor:pointer;font-family:inherit;font-weight:700;margin-right:4px;}
  .btn-edit:hover{border-color:var(--green);}
  .cust-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:7px;font-weight:700;margin-top:3px;}
  .cust-member{background:#EAF0F2;color:#3A6577;border:1px solid #B8D0DA;}
  .cust-new{background:#F3EFE8;color:#9A8F7C;border:1px solid #E0D8C9;}
  .today-row td:first-child{border-left:3px solid var(--green);}
  .new-row{background:#FEF6EC !important;}
  .new-row td:first-child{border-left:3px solid #E8911E;}

  .empty{text-align:center;padding:32px;color:var(--muted);}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 18px;border-radius:18px;font-size:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;}

  /* カレンダー */
  .cal-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-size:14px;font-weight:700;}
  .cal-nav{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--warm);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:10px;color:var(--muted);font-weight:700;padding:3px 0;text-align:center;}
  .cal-cell{min-height:80px;display:flex;flex-direction:column;border-radius:7px;font-size:12px;cursor:default;padding:3px;border:1px solid transparent;}
  .cal-cell.has{background:var(--warm);border:1px solid var(--line);cursor:pointer;}
  .cal-cell.has:hover{border-color:var(--green);}
  .cal-cell.has.picked{background:#EFF4F2;border-color:var(--green);}
  .cal-cell.today-mark{border:2px solid var(--amber) !important;}
  .cal-daynum{font-size:12px;font-weight:700;text-align:left;padding:1px 3px;color:var(--ink);}
  .cal-evts{display:flex;flex-direction:column;gap:2px;margin-top:1px;}
  .cal-evt{font-size:10px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
  .cal-evt-new{background:#FBE9D6;color:#C26A12;font-weight:700;}
  .cal-evt-ok{background:#EAF3E6;color:#3D7A4A;}
  .cal-evt-cancel{background:#F3E8E6;color:var(--red);text-decoration:line-through;}
  .cal-more{font-size:9px;color:var(--muted);padding:0 4px;}
  .cal-empty{visibility:hidden;}
  .view-toggle{display:flex;gap:5px;margin-bottom:10px;}
  .vt-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);}
  .vt-btn.on{background:var(--deep);color:#fff;border-color:var(--deep);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ログイン画面（パスワード方式・秘密はファイルに残さない） -->
<div id="loginView" style="position:fixed;inset:0;background:#544739;color:#EFEAE0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:300;">
  <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;letter-spacing:3px;margin-bottom:6px;">THE HERBS</div>
  <div style="font-size:13px;color:#A9BBB5;font-weight:700;margin-bottom:20px;">予約管理</div>
  <div style="font-size:13px;color:#D8D0C4;margin-bottom:14px;">パスワードを入力してください</div>
  <input id="loginPw" type="password" autocomplete="current-password" placeholder="パスワード" style="width:min(280px,80vw);padding:11px 13px;border:none;border-radius:9px;font-size:15px;margin-bottom:10px;" />
  <div id="loginErr" style="color:#F2B8B0;font-size:13px;min-height:18px;margin-bottom:8px;font-weight:700;"></div>
  <button id="loginBtn" style="width:min(280px,80vw);padding:12px;background:#6E847C;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">ログイン</button>
</div>

<div class="hd">
  予約管理
  <span class="store-badge" id="storeBadge">読み込み中…</span>
  <span class="ml" style="font-size:11px;opacity:.7;" id="countBadge"></span>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="view-toggle">
      <button class="vt-btn on" id="vListBtn" onclick="setView('list')">一覧</button>
      <button class="vt-btn" id="vCalBtn" onclick="setView('cal')">カレンダー</button>
    </div>
    <div class="chips" id="statusChips">
      <span class="chip on" data-s="all">すべて</span>
      <span class="chip" data-s="受付中">受付中</span>
      <span class="chip" data-s="確定">確定</span>
      <span class="chip" data-s="キャンセル">キャンセル</span>
    </div>
    <button class="btn btn-primary ml" id="addBtn">＋ 予約追加</button>
  </div>

  <!-- カレンダー（初期非表示） -->
  <div id="calView" style="display:none;">
    <div class="cal-wrap">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calDow">
        <div class="cal-dow">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div>
        <div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div>
        <div class="cal-dow">土</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 追加フォーム -->
  <div class="form-card" id="addForm">
    <h3>予約を追加（電話・来店受付）</h3>
    <div class="frow">
      <div class="fg"><label>メニュー</label><select id="f_menu"><option value="">選択</option></select></div>
      <div class="fg"><label>氏名 *</label><input id="f_name" placeholder="山田 花子" /></div>
      <div class="fg"><label>電話番号</label><input id="f_phone" type="tel" placeholder="090-0000-0000" /></div>
      <div class="fg"><label>メールアドレス</label><input id="f_email" type="email" placeholder="example@email.com" /></div>
    </div>
    <div class="frow">
      <div class="fg"><label>希望日</label><input id="f_date" type="date" /></div>
      <div class="fg"><label>希望時間</label><select id="f_time"></select></div>
      <div class="fg"><label>性別</label>
        <select id="f_gender"><option value="">未回答</option><option value="女性">女性</option><option value="男性">男性</option></select>
      </div>
      <div class="fg"><label>予約経路</label>
        <select id="f_source"><option value="電話予約">電話予約</option><option value="来店予約">来店予約</option><option value="Web予約">Web予約</option></select>
      </div>
    </div>
    <div class="frow">
      <div class="fg" style="flex:2;"><label>備考</label><input id="f_notes" placeholder="アレルギーなど" /></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addResv()">追加する</button>
      <button class="btn btn-ghost" onclick="closeForm()">キャンセル</button>
    </div>
  </div>

  <!-- 一覧テーブル -->
  <div class="tbl-wrap" id="listView">
    <div class="empty">読み込み中…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 編集モーダル -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(60,50,40,.42);z-index:100;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;">
  <div style="background:#fff;border-radius:14px;width:100%;max-width:460px;padding:20px 22px;box-shadow:0 18px 50px rgba(60,50,40,.25);margin:auto;">
    <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;color:var(--deep);">予約内容の変更</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="fg"><label>メニュー</label><select id="e_menu"><option value="">選択</option></select></div>
      <div class="fg"><label>氏名 *</label><input id="e_name" /></div>
      <div class="fg"><label>電話番号</label><input id="e_phone" type="tel" /></div>
      <div class="fg"><label>メールアドレス</label><input id="e_email" type="email" /></div>
      <div style="display:flex;gap:10px;">
        <div class="fg" style="flex:1;"><label>希望日</label><input id="e_date" type="date" /></div>
        <div class="fg" style="flex:1;"><label>希望時間</label><select id="e_time"></select></div>
      </div>
      <div class="fg"><label>備考</label><input id="e_notes" /></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeEdit()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">変更を保存</button>
    </div>
  </div>
</div>

<script>
const API='https://herbs-booking-api.vercel.app/api/store';
const STORE_APP='https://theherbs-store-git-main-yumiko-s-projects.vercel.app';
let PW = sessionStorage.getItem('resv_pw') || '';

// 販売システムの顧客データベース（顧客照合用）
const CUST_SB_URL='https://bpogujxrwdpzkfisscox.supabase.co';
const CUST_SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwb2d1anhyd2RwemtmaXNzY294Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1OTQ0NjEsImV4cCI6MjA5NzE3MDQ2MX0.b39pjEYrTbS_U49Ud5GTEHh_luveh5wkZdtnWJN2x0M';
let custClient=null;
try{ custClient=supabase.createClient(CUST_SB_URL,CUST_SB_KEY); }catch(e){ console.error('顧客DB接続エラー:',e.message); }
let CUST_MAP={}; // 電話番号(数字のみ) → 顧客 のキャッシュ
let CUST_MAP8={}; // 電話番号末尾8桁 → 顧客（形式違い吸収用）
let CUST_DIAG=''; // 顧客照合の状況（診断表示用）

// 電話番号を数字だけにする
function normPhone(s){ return String(s||'').replace(/[^\d]/g,''); }
// 顧客照合：完全一致を優先、なければ末尾8桁
function findCust(phone){
  const p=normPhone(phone);
  if(p.length<10) return null;
  return CUST_MAP[p]||CUST_MAP8[p.slice(-8)]||null;
}

// 予約一覧の電話番号をまとめて顧客照合
async function matchCustomers(){
  if(!custClient){ CUST_DIAG='顧客DB未接続'; return; }
  try{
    CUST_MAP={}; CUST_MAP8={};
    let total=0, matched=0;
    // 顧客を全件読み込み（1000件ずつページング）し、電話番号を数字だけで突き合わせる
    for(let page=0; page<15; page++){
      const from=page*1000;
      const { data, error } = await custClient.from('customers')
        .select('id,name,memberId,phone').neq('isDeleted',true).range(from, from+999);
      if(error){ console.error('顧客照合エラー:',error.message); CUST_DIAG='顧客読込エラー'; return; }
      if(!data || !data.length) break;
      data.forEach(c=>{ const p=normPhone(c.phone); if(p.length>=10){ CUST_MAP[p]=c; CUST_MAP8[p.slice(-8)]=c; } });
      total+=data.length;
      if(data.length<1000) break;
    }
    // 予約のうち何件が顧客とひもづいたか
    const seen=new Set();
    ALL.forEach(r=>{ const c=findCust(r.phone); if(c){ const k=String(r.phone); if(!seen.has(k)){ seen.add(k); matched++; } } });
    CUST_DIAG=`顧客${total}件・紐付${matched}件`;
  }catch(e){ console.error('顧客照合エラー:',e.message); CUST_DIAG='顧客照合エラー'; }
}
let ALL=[],MENUS=[],STORE='',STATUS_F='all',VIEW='list';
let CAL_Y=new Date().getFullYear(),CAL_M=new Date().getMonth()+1,CAL_PICK='';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function detectStore(){
  try{
    const p=new URLSearchParams(location.search).get('store');
    if(p){ const t=p.toLowerCase(); if(t.includes('阪急'))return'神戸阪急'; if(t.includes('本店')||t.includes('サロン'))return'本店'; return p; }
    const s=JSON.parse(localStorage.getItem('scalp_salon'));if(!s)return'';const n=(s.name||'').toLowerCase();if(n.includes('阪急'))return'神戸阪急';if(n.includes('本店')||n.includes('サロン'))return'本店';return s.name||'';
  }catch(e){return'';}
}

async function post(action,extra={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PW,action,store:STORE||undefined,...extra})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'エラー');return d;
}

function todayJST(){return new Date().toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');}

function filtered(){
  let list=ALL.filter(r=>STATUS_F==='all'||r.status===STATUS_F);
  if(CAL_PICK&&VIEW==='cal') list=list.filter(r=>r.desired_date===CAL_PICK);
  list.sort((a,b)=>{const da=a.desired_date||'0000',db=b.desired_date||'0000';if(da!==db)return da>db?-1:1;return(a.desired_time||'')>(b.desired_time||'')?-1:1;});
  return list;
}

function render(){
  const list=filtered();
  document.getElementById('countBadge').textContent=`${list.length}件`+(CUST_DIAG?` ・ ${CUST_DIAG}`:'');
  const badge=s=>{const m={'受付中':'b-new','確定':'b-ok','保留':'b-hold','キャンセル':'b-ng'};return`<span class="badge ${m[s]||''}">${esc(s)}</span>`;};
  const routeBadge=src=>{const s=String(src||'');if(/web/i.test(s))return'<span class="badge b-web">Web</span>';if(s.includes('電話'))return'<span class="badge b-tel">電話</span>';if(s.includes('来店'))return'<span class="badge b-walk">来店</span>';return s?esc(s):'—';};
  const today=todayJST();
  if(!list.length){document.getElementById('listView').innerHTML='<div class="empty">該当する予約はありません</div>';return;}
  let h=`<table><thead><tr><th>希望日時</th><th>氏名</th><th>メニュー</th><th>電話</th><th>経路</th><th>ステータス</th><th></th></tr></thead><tbody>`;
  list.forEach(r=>{
    const dt=r.desired_date||'';
    const isT=dt===today;
    const isNew=r.status==='受付中';
    const dtLabel=dt?new Date(dt+'T00:00:00+09:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}):'日程未定';
    // 顧客照合
    const cust=findCust(r.phone);
    const custBadge=cust
      ? `<a class="cust-tag cust-member" href="${STORE_APP}/customer-history-live.html?customerId=${encodeURIComponent(cust.id)}" target="_blank" rel="noopener" style="text-decoration:none;" title="顧客の履歴・カルテを開く">${esc(cust.name||'会員')} の履歴 ↗</a>`
      : `<span class="cust-tag cust-new">未登録</span>`;
    h+=`<tr class="${isNew?'new-row':''} ${isT?'today-row':''}">
      <td class="td-time${isT?' td-today':''}">${dtLabel}<br>${esc(r.desired_time||'—')}</td>
      <td class="td-name">${esc(r.name)} ${isNew?'<span class="badge b-new" style="margin-left:4px;">NEW</span>':''}<br>${custBadge}</td>
      <td class="td-menu">${esc(r.menu_name||'—')}</td>
      <td>${esc(r.phone||'—')}${r.email?`<br><span style="font-size:11px;color:var(--muted);">${esc(r.email)}</span>`:''}</td>
      <td>${routeBadge(r.source)}</td>
      <td>
        <select class="status-sel" data-id="${esc(r.id)}" onchange="chgStatus(this)">
          ${['受付中','確定','保留','キャンセル'].map(s=>`<option value="${s}"${r.status===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td style="white-space:nowrap;">
        <button class="btn-edit" onclick='openEdit(${JSON.stringify(r).replace(/'/g,"&#39;")})'>編集</button>
        <button class="btn-del" onclick="delResv('${esc(r.id)}')">削除</button>
      </td>
    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('listView').innerHTML=h;
}

function renderCal(){
  const daysInMonth=new Date(CAL_Y,CAL_M,0).getDate();
  const startDow=new Date(CAL_Y,CAL_M-1,1).getDay();
  const today=todayJST();
  // その月の予約を日付ごとにまとめる
  const dayItems={};
  ALL.filter(r=>STATUS_F==='all'||r.status===STATUS_F).forEach(r=>{
    if(!r.desired_date)return;
    const d=new Date(r.desired_date+'T00:00:00+09:00');
    if(d.getFullYear()===CAL_Y&&d.getMonth()+1===CAL_M){
      const dd=String(d.getDate()).padStart(2,'0');
      (dayItems[dd]=dayItems[dd]||[]).push(r);
    }
  });
  // 各日の予約を時間順にソート
  Object.values(dayItems).forEach(arr=>arr.sort((a,b)=>(a.desired_time||'')>(b.desired_time||'')?1:-1));
  document.getElementById('calTitle').textContent=`${CAL_Y}年${CAL_M}月`;
  let h='';
  for(let i=0;i<startDow;i++)h+=`<div class="cal-cell cal-empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dd=String(d).padStart(2,'0');
    const dateStr=`${CAL_Y}-${String(CAL_M).padStart(2,'0')}-${dd}`;
    const items=dayItems[dd]||[];
    const cnt=items.length;
    const isToday=dateStr===today;
    const isPicked=dateStr===CAL_PICK;
    const cls=['cal-cell',cnt?'has':'',isPicked?'picked':'',isToday?'today-mark':''].filter(Boolean).join(' ');
    // 予約を最大3件まで表示
    const evts=items.slice(0,3).map(r=>{
      const st=r.status==='キャンセル'?'cancel':r.status==='確定'?'ok':'new';
      return `<div class="cal-evt cal-evt-${st}">${esc(r.desired_time||'')} ${esc(r.name||'')}</div>`;
    }).join('');
    const more=cnt>3?`<div class="cal-more">他${cnt-3}件</div>`:'';
    h+=`<div class="${cls}" onclick="${cnt?`pickDay('${dateStr}')`:''}">
      <div class="cal-daynum">${d}</div>
      <div class="cal-evts">${evts}${more}</div>
    </div>`;
  }
  document.getElementById('calGrid').innerHTML=h;
}

function pickDay(dateStr){
  CAL_PICK=CAL_PICK===dateStr?'':dateStr;
  renderCal();render();
}

function setView(v){
  VIEW=v;CAL_PICK='';
  document.getElementById('vListBtn').classList.toggle('on',v==='list');
  document.getElementById('vCalBtn').classList.toggle('on',v==='cal');
  document.getElementById('calView').style.display=v==='cal'?'':'none';
  if(v==='cal'){renderCal();}
  render();
}

document.getElementById('calPrev').onclick=()=>{CAL_M--;if(CAL_M<1){CAL_M=12;CAL_Y--;}CAL_PICK='';renderCal();render();};
document.getElementById('calNext').onclick=()=>{CAL_M++;if(CAL_M>12){CAL_M=1;CAL_Y++;}CAL_PICK='';renderCal();render();};

document.getElementById('statusChips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('#statusChips .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');STATUS_F=c.dataset.s;renderCal();render();
});

document.getElementById('addBtn').onclick=()=>document.getElementById('addForm').classList.toggle('open');
function closeForm(){document.getElementById('addForm').classList.remove('open');}

async function chgStatus(sel){
  const id=sel.dataset.id,status=sel.value;
  try{await post('updateReservationStatus',{id,status});ALL=ALL.map(r=>r.id===id?{...r,status}:r);toast('更新しました');renderCal();render();}
  catch(e){toast(e.message);}
}
async function delResv(id){
  if(!confirm('この予約を削除しますか？'))return;
  try{await post('deleteReservation',{id});ALL=ALL.filter(r=>r.id!==id);toast('削除しました');renderCal();render();}
  catch(e){toast(e.message);}
}

// ===== 予約編集 =====
let EDIT_ID=null;
function openEdit(r){
  EDIT_ID=r.id;
  // メニュー選択肢を構築
  const sel=document.getElementById('e_menu');
  sel.innerHTML='<option value="">選択してください</option>'+MENUS.map(m=>`<option value="${esc(m.id)}"${r.menu_id===m.id?' selected':''}>${esc(m.name)}</option>`).join('');
  // メニューIDが一致しない（旧データなど）場合、現在のメニュー名を表示用に追加
  if(r.menu_name && !MENUS.some(m=>m.id===r.menu_id)){
    const o=document.createElement('option'); o.value=''; o.textContent=`（現在：${r.menu_name}）`; o.selected=true; sel.insertBefore(o,sel.children[1]);
  }
  document.getElementById('e_name').value=r.name||'';
  document.getElementById('e_phone').value=r.phone||'';
  document.getElementById('e_email').value=r.email||'';
  document.getElementById('e_date').value=r.desired_date||'';
  ensureTimeOption('e_time',r.desired_time);
  document.getElementById('e_time').value=r.desired_time||'';
  document.getElementById('e_notes').value=r.notes||'';
  document.getElementById('editModal').style.display='flex';
}
function closeEdit(){ document.getElementById('editModal').style.display='none'; EDIT_ID=null; }
async function saveEdit(){
  const name=document.getElementById('e_name').value.trim();
  if(!name){ toast('氏名を入力してください'); return; }
  const menuSel=document.getElementById('e_menu');
  const menuId=menuSel.value;
  // メニューが選択されていればその名前、未選択なら既存の名前を維持
  let menuName;
  if(menuId){ menuName=menuSel.options[menuSel.selectedIndex].text; }
  else { const cur=ALL.find(r=>r.id===EDIT_ID); menuName=cur?cur.menu_name:null; }
  const body={
    id:EDIT_ID,
    menu_id:menuId||null,
    menu_name:menuName||null,
    name,
    phone:document.getElementById('e_phone').value.trim()||null,
    email:document.getElementById('e_email').value.trim()||null,
    desired_date:document.getElementById('e_date').value||null,
    desired_time:document.getElementById('e_time').value.trim()||null,
    notes:document.getElementById('e_notes').value.trim()||null,
  };
  try{
    await post('updateReservation',body);
    ALL=ALL.map(r=>r.id===EDIT_ID?{...r,...body}:r);
    toast('変更しました');
    closeEdit();renderCal();render();
  }catch(e){ toast(e.message); }
}
async function addResv(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){toast('氏名を入力してください');return;}
  const menuSel=document.getElementById('f_menu');
  const menuId=menuSel.value;
  const menuName=menuId?menuSel.options[menuSel.selectedIndex].text:'';
  const body={menu_id:menuId||null,menu_name:menuName||null,name,
    phone:document.getElementById('f_phone').value.trim()||null,
    email:document.getElementById('f_email').value.trim()||null,
    desired_date:document.getElementById('f_date').value||null,
    desired_time:document.getElementById('f_time').value||null,
    gender:document.getElementById('f_gender').value||null,
    notes:document.getElementById('f_notes').value.trim()||null,
    source:document.getElementById('f_source').value||'手動登録',store:STORE||'本店'};
  try{
    const d=await post('addReservation',body);
    ALL.push({...body,id:d.id,status:'受付中'});
    toast('追加しました');
    ['f_name','f_phone','f_email','f_date','f_notes'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f_time').value='';
    document.getElementById('f_source').value='電話予約';
    document.getElementById('f_menu').value='';
    closeForm();renderCal();render();
  }catch(e){toast(e.message);}
}

async function load(){
  STORE=detectStore();
  const d=await post('listReservations');
  ALL=d.reservations||[];MENUS=d.menus||[];
  document.getElementById('storeBadge').textContent=(d.store||STORE||'全店舗');
  const sel=document.getElementById('f_menu');
  sel.innerHTML='<option value="">選択してください</option>'+MENUS.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}（${m.duration_min}分）</option>`).join('');
  render();
  // 顧客照合（バックグラウンドで実行し、完了後に再描画）
  matchCustomers().then(render).catch(()=>{});
}

// ===== ログイン制御 =====
function showLogin(msg){ document.getElementById('loginView').style.display='flex'; document.getElementById('loginErr').textContent=msg||''; }
function hideLogin(){ document.getElementById('loginView').style.display='none'; }
async function doLogin(){
  const pw=(document.getElementById('loginPw').value||'').trim();
  if(!pw){ document.getElementById('loginErr').textContent='パスワードを入力してください'; return; }
  PW=pw; document.getElementById('loginErr').textContent='確認中…';
  try{
    await load();
    sessionStorage.setItem('resv_pw',PW);
    document.getElementById('loginPw').value='';
    hideLogin();
  }catch(e){
    PW=''; sessionStorage.removeItem('resv_pw');
    document.getElementById('loginErr').textContent=(/認証/.test(e.message)?'パスワードが違います':e.message);
  }
}
// ===== 希望時間ドロップダウン（30分刻み 10:00〜20:00）=====
function fillTimeOptions(){
  const opts=['<option value="">選択</option>'];
  for(let h=10;h<=20;h++){ for(const m of ['00','30']){ if(h===20&&m==='30')break; opts.push(`<option value="${h}:${m}">${h}:${m}</option>`); } }
  const html=opts.join('');
  ['f_time','e_time'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=html; });
}
function ensureTimeOption(selId,val){
  if(!val) return;
  const el=document.getElementById(selId);
  if(el && !Array.from(el.options).some(o=>o.value===val)){
    const o=document.createElement('option'); o.value=val; o.textContent=val; el.appendChild(o);
  }
}
fillTimeOptions();

document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });

if(PW){ load().then(hideLogin).catch(()=>{ PW=''; sessionStorage.removeItem('resv_pw'); showLogin(); }); }
else { showLogin(); }

</script>
